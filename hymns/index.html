<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>詩歌多語對照</title>
<style>
:root{
  --bg:#FFFDF5; --card:#ffffff; --ink:#2b2b2b; --muted:#666666; --line:#eeeae0;
  --accent:#86641A; --accent-soft:#FFF6DE; --ko:#1d4f7a; --roman:#7a4a1d; --zy:#2f6b3f; --chg:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --card:#211f1c; --ink:#ece7df; --muted:#a39d93; --line:#34302b;
    --accent:#d9a66b; --accent-soft:#3a2f23; --ko:#8cc0ec; --roman:#e2b27f; --zy:#8fcf9e; --chg:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --card:#211f1c; --ink:#ece7df; --muted:#a39d93; --line:#34302b;
  --accent:#d9a66b; --accent-soft:#3a2f23; --ko:#8cc0ec; --roman:#e2b27f; --zy:#8fcf9e; --chg:#ff8a80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Noto Sans KR","Noto Sans Thai","Noto Sans Lao","Phetsarath OT",sans-serif;line-height:1.5;font-size:calc(16px * var(--scale,1))}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
a{color:var(--accent)}
header .back{font-size:.9em;text-decoration:none}
h1{font-size:1.5em;margin:.4em 0 .2em}
.intro{color:var(--muted);margin:0 0 1em;font-size:.95em}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.langs button{font:inherit;font-size:.95em;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.langs button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
input[type=search],input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:180px;font-family:inherit;line-height:1.6}
textarea.small{min-height:70px}
.list{list-style:none;padding:0;margin:12px 0}
.list li a{display:flex;gap:12px;align-items:baseline;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.list .no{color:var(--accent);font-weight:600;min-width:4.5em;font-size:.9em}
.list .ko{color:var(--ko);font-size:.9em}
.list .tag{margin-left:auto;font-size:.75em;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.chip-btn{font:inherit;font-size:.82em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chip-btn.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.hymn-title h2{margin:.2em 0 0;font-size:1.3em}
.hymn-title .kot{color:var(--ko);font-size:1.05em}
.hymn-title .nos{color:var(--muted);font-size:.85em}
.verse{margin:18px 0}
.vlabel{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;border-radius:8px;padding:0 9px;font-size:.85em;margin-bottom:6px}
.vlabel.chorus{background:var(--ko)}
.ln{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.ln .zh{grid-column:1;font-size:1.02em}
.ln .play{grid-column:2;grid-row:1 / span 3;align-self:start;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:15px;cursor:pointer}
.ln .play.speaking{background:var(--accent);color:var(--bg)}
.syls{grid-column:1;display:flex;flex-wrap:wrap;gap:6px 14px;min-width:0}
.w{display:flex;flex-wrap:wrap;gap:2px}
.s{display:flex;flex-direction:column;align-items:center;min-width:1.9em;padding:2px 3px;border-radius:6px;cursor:pointer}
.s:hover{background:var(--accent-soft)}
.s .h{color:var(--ko);font-size:1.25em;line-height:1.3}
.s.st .h{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.s .p{color:var(--chg);font-size:.72em;line-height:1.2}
.s .r{color:var(--roman);font-size:.72em;line-height:1.3}
.s .z{color:var(--zy);font-size:.72em;line-height:1.3;white-space:nowrap}
.pn{align-self:flex-start;color:var(--muted);font-size:1.2em;padding-top:2px}
.flat{grid-column:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.flat .h{color:var(--ko);font-size:1.15em}
.flat .p{color:var(--chg);font-size:.85em}
.flat .r{color:var(--roman);font-size:.9em}
.flat .z{color:var(--zy);font-size:.9em}
body.hide-zh .zh, body.hide-r .r, body.hide-z .z, body.hide-p .p{display:none}
.legend{font-size:.78em;color:var(--muted);margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend b{font-weight:500}
.legend .k{color:var(--ko)} .legend .r{color:var(--roman)} .legend .z{color:var(--zy)} .legend .p{color:var(--chg)}
.form{display:grid;gap:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:.85em;color:var(--muted);display:block;margin-bottom:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.help{font-size:.85em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.help code{background:var(--accent-soft);padding:0 4px;border-radius:4px}
.note{font-size:.82em;color:var(--muted);margin:8px 0}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.bcard .bhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bcard .bidx{font-weight:700;color:var(--accent)}
.bcard .first{font-size:.9em;color:var(--muted);margin:2px 0}
.bcard .first b{color:var(--ink);font-weight:500}
.bcard select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.bcard .warn{color:var(--chg);font-size:.82em}
.bcard .ok{color:var(--zy);font-size:.82em}
.bcard label.skip{display:flex;gap:6px;align-items:center;font-size:.85em;color:var(--muted);margin-left:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9em;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){.form .row{grid-template-columns:1fr}.syls{gap:6px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 回首頁</a>
    <h1>主恢復詩歌 多語對照</h1>
    <p class="intro">逐節逐句：中文、原文、羅馬拼音、注音近似音。點任一字聽單字，按 ▶ 聽整句。</p>
  </header>
  <div class="langs" id="langs"></div>
  <nav class="tabs">
    <button data-tab="list" class="on">詩歌目錄</button>
    <button data-tab="edit">新增詩歌</button>
    <button data-tab="batch">批次貼上</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script src="hymns.js" onerror="window.HYMNS_ENC=window.HYMNS_ENC||null"></script>
<script>
/* 韓文發音引擎：拆字 → 套用發音規則 → 羅馬拼音 + 注音近似音 */
(function (root) {
  const L_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const V_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const T_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  function decompose(ch) {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c < 0 || c > 11171) return null;
    return { L: L_LIST[Math.floor(c / 588)], V: V_LIST[Math.floor((c % 588) / 28)], T: T_LIST[c % 28] };
  }
  function compose(s) {
    const l = L_LIST.indexOf(s.L), v = V_LIST.indexOf(s.V), t = T_LIST.indexOf(s.T);
    if (l < 0 || v < 0 || t < 0) return '?';
    return String.fromCharCode(0xAC00 + (l * 21 + v) * 28 + t);
  }

  // 一行切成：詞（韓文字串）、空白、標點
  function tokenize(line) {
    const out = [];
    let word = null, other = '';
    const flushWord = () => { if (word) { out.push({ type: 'word', syl: word }); word = null; } };
    const flushOther = () => { if (other) { out.push({ type: 'punct', text: other }); other = ''; } };
    for (const ch of line) {
      const d = decompose(ch);
      if (d) { flushOther(); (word = word || []).push(Object.assign({ orig: ch }, d)); }
      else if (/\s/.test(ch)) { flushWord(); flushOther(); if (out.length && out[out.length - 1].type !== 'space') out.push({ type: 'space' }); }
      else { flushWord(); other += ch; }
    }
    flushWord(); flushOther();
    return out;
  }

  const SPLIT = { 'ㄳ':['ㄱ','ㅆ'],'ㄵ':['ㄴ','ㅈ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅆ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅄ':['ㅂ','ㅆ'] };
  const ASPIRATE = { 'ㄱ':'ㅋ','ㄷ':'ㅌ','ㅂ':'ㅍ','ㅈ':'ㅊ' };
  const H_AFTER = { 'ㄱ':['','ㅋ'],'ㄲ':['','ㅋ'],'ㄳ':['ㄱ','ㅆ'],'ㄺ':['ㄹ','ㅋ'],'ㄷ':['','ㅌ'],'ㅅ':['','ㅌ'],'ㅆ':['','ㅌ'],'ㅈ':['','ㅊ'],'ㅊ':['','ㅊ'],'ㅌ':['','ㅌ'],'ㅂ':['','ㅍ'],'ㅍ':['','ㅍ'],'ㄼ':['ㄹ','ㅍ'],'ㄵ':['ㄴ','ㅊ'],'ㅄ':['','ㅍ'] };
  const NEUT = { 'ㄱ':'ㄱ','ㄲ':'ㄱ','ㅋ':'ㄱ','ㄳ':'ㄱ','ㄺ':'ㄱ','ㄴ':'ㄴ','ㄵ':'ㄴ','ㄶ':'ㄴ','ㄷ':'ㄷ','ㅅ':'ㄷ','ㅆ':'ㄷ','ㅈ':'ㄷ','ㅊ':'ㄷ','ㅌ':'ㄷ','ㅎ':'ㄷ','ㄹ':'ㄹ','ㄼ':'ㄹ','ㄽ':'ㄹ','ㄾ':'ㄹ','ㅀ':'ㄹ','ㅁ':'ㅁ','ㄻ':'ㅁ','ㅂ':'ㅂ','ㅍ':'ㅂ','ㅄ':'ㅂ','ㄿ':'ㅂ','ㅇ':'ㅇ','':'' };
  const TENSE = { 'ㄱ':'ㄲ','ㄷ':'ㄸ','ㅂ':'ㅃ','ㅅ':'ㅆ','ㅈ':'ㅉ' };
  const NASAL = { 'ㄱ':'ㅇ','ㄷ':'ㄴ','ㅂ':'ㅁ' };

  // 一個詞內套用發音規則，回傳實際發音的音節
  function pronounce(syl) {
    const p = syl.map(s => ({ L: s.L, V: s.V, T: s.T }));
    const n = p.length;
    const pairs = f => { for (let i = 0; i < n - 1; i++) f(p[i], p[i + 1]); };

    // 1. ㅎ 激音化／脫落
    pairs((a, b) => {
      if (a.T === 'ㅎ' || a.T === 'ㄶ' || a.T === 'ㅀ') {
        const rem = a.T === 'ㅎ' ? '' : (a.T === 'ㄶ' ? 'ㄴ' : 'ㄹ');
        if (ASPIRATE[b.L]) { b.L = ASPIRATE[b.L]; a.T = rem; }
        else if (b.L === 'ㅅ') { b.L = 'ㅆ'; a.T = rem; }
        else if (b.L === 'ㄴ') { a.T = rem || 'ㄴ'; }
        else if (b.L === 'ㅇ') { a.T = ''; if (rem) b.L = rem; }
      } else if (b.L === 'ㅎ' && H_AFTER[a.T]) {
        const r = H_AFTER[a.T]; a.T = r[0]; b.L = r[1];
        if (b.L === 'ㅌ' && b.V === 'ㅣ') b.L = 'ㅊ';
      }
    });
    // 2. 連音
    pairs((a, b) => {
      if (b.L !== 'ㅇ' || !a.T || a.T === 'ㅇ') return;
      if (SPLIT[a.T]) { const s = SPLIT[a.T]; a.T = s[0]; b.L = s[1]; }
      else { b.L = a.T; a.T = ''; }
      if (b.V === 'ㅣ') { if (b.L === 'ㄷ') b.L = 'ㅈ'; else if (b.L === 'ㅌ') b.L = 'ㅊ'; }
    });
    // 3. 收尾音代表音
    for (let i = 0; i < n; i++) {
      const a = p[i], b = p[i + 1];
      if (a.T === 'ㄺ' && b && b.L === 'ㄱ') { a.T = 'ㄹ'; b.L = 'ㄲ'; }
      else a.T = NEUT[a.T] !== undefined ? NEUT[a.T] : a.T;
    }
    // 4. ㄹ 相關
    pairs((a, b) => {
      if (b.L === 'ㄹ') {
        if (a.T === 'ㄴ') a.T = 'ㄹ';
        else if (a.T === 'ㅁ' || a.T === 'ㅇ' || NASAL[a.T]) b.L = 'ㄴ';
      }
      if (a.T === 'ㄹ' && b.L === 'ㄴ') b.L = 'ㄹ';
    });
    // 5. 鼻音化
    pairs((a, b) => { if ((b.L === 'ㄴ' || b.L === 'ㅁ') && NASAL[a.T]) a.T = NASAL[a.T]; });
    // 6. 緊音化
    pairs((a, b) => { if (NASAL[a.T] && TENSE[b.L]) b.L = TENSE[b.L]; });
    // 7. 母音
    p.forEach((s, i) => {
      if (s.V === 'ㅢ') {
        if (syl[i].L !== 'ㅇ') s.V = 'ㅣ';
        else if (i > 0 && i === n - 1) s.V = 'ㅔ';   // 助詞「의」
        else if (i > 0) s.V = 'ㅣ';
      }
      if (s.V === 'ㅖ' && s.L !== 'ㅇ' && s.L !== 'ㄹ') s.V = 'ㅔ';
    });
    return p;
  }

  const RR_L = { 'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h' };
  const RR_V = { 'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i' };
  const RR_T = { '':'','ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng' };

  function roman(s, prev) {
    const l = (s.L === 'ㄹ' && prev && prev.T === 'ㄹ') ? 'l' : RR_L[s.L];
    return l + RR_V[s.V] + (RR_T[s.T] !== undefined ? RR_T[s.T] : '');
  }

  const ZI = { 'ㄱ':'ㄍ','ㄲ':'ㄍ','ㄴ':'ㄋ','ㄷ':'ㄉ','ㄸ':'ㄉ','ㄹ':'ㄌ','ㅁ':'ㄇ','ㅂ':'ㄅ','ㅃ':'ㄅ','ㅅ':'ㄙ','ㅆ':'ㄙ','ㅇ':'','ㅈ':'ㄗ','ㅉ':'ㄗ','ㅊ':'ㄘ','ㅋ':'ㄎ','ㅌ':'ㄊ','ㅍ':'ㄆ','ㅎ':'ㄏ' };
  const ZV = { 'ㅏ':'ㄚ','ㅐ':'ㄝ','ㅑ':'ㄧㄚ','ㅒ':'ㄧㄝ','ㅓ':'ㄛ','ㅔ':'ㄝ','ㅕ':'ㄧㄛ','ㅖ':'ㄧㄝ','ㅗ':'ㄡ','ㅘ':'ㄨㄚ','ㅙ':'ㄨㄝ','ㅚ':'ㄨㄝ','ㅛ':'ㄧㄡ','ㅜ':'ㄨ','ㅝ':'ㄨㄛ','ㅞ':'ㄨㄝ','ㅟ':'ㄨㄧ','ㅠ':'ㄧㄨ','ㅡ':'ㄜ','ㅢ':'ㄜㄧ','ㅣ':'ㄧ' };
  const ZT = { 'ㄹ':'ˡ','ㅁ':'ᵐ','ㄱ':'ᵏ','ㄷ':'ᵗ','ㅂ':'ᵖ' };

  function zhuyin(s) {
    let i = ZI[s.L], v = ZV[s.V];
    if (v[0] === 'ㄧ') i = ({ 'ㄙ':'ㄒ','ㄗ':'ㄐ','ㄘ':'ㄑ' })[i] || i;
    const last = v[v.length - 1], head = v.slice(0, -1);
    if (s.T === 'ㄴ') {
      if (v === 'ㄧㄛ') v = 'ㄧㄢ';
      else if (last === 'ㄚ') v = head + 'ㄢ';
      else if (last === 'ㄛ' || last === 'ㄜ') v = head + 'ㄣ';
      else if (last === 'ㄧ' || last === 'ㄨ') v = v + 'ㄣ';
      else v = v + 'ⁿ';
    } else if (s.T === 'ㅇ') {
      if (last === 'ㄚ') v = head + 'ㄤ';
      else if (last === 'ㄛ' || last === 'ㄜ') v = head + 'ㄥ';
      else if (v === 'ㄡ') v = 'ㄨㄥ';
      else if (v === 'ㄧㄡ') v = 'ㄩㄥ';
      else if (last === 'ㄧ' || last === 'ㄨ') v = v + 'ㄥ';
      else v = v + 'ⁿᵍ';
    } else if (ZT[s.T]) v = v + ZT[s.T];
    return i + v;
  }

  // 一整行 → token 陣列，每個音節帶 orig / pron / roman / zy
  function analyze(line) {
    return tokenize(line || '').map(tok => {
      if (tok.type !== 'word') return tok;
      const pr = pronounce(tok.syl);
      return {
        type: 'word',
        syl: tok.syl.map((s, i) => ({
          orig: s.orig,
          pron: compose(pr[i]),
          roman: roman(pr[i], pr[i - 1]),
          zy: zhuyin(pr[i])
        }))
      };
    });
  }
  function lineRoman(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.roman).join('') : t.type === 'space' ? ' ' : t.text).join('');
  }
  function lineZhuyin(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.zy).join(' ') : t.type === 'space' ? '　' : t.text).join('');
  }
  function linePron(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.pron).join('') : t.type === 'space' ? ' ' : t.text).join('');
  }

  root.KoPron = { analyze, lineRoman, lineZhuyin, linePron };
  if (typeof module !== 'undefined') module.exports = root.KoPron;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 泰文、寮文、西班牙文發音引擎：拆音節 → 羅馬拼音 + 注音近似音 */
(function (root) {
  // ---------- 共用：音素 → 拼音／注音 ----------
  const VR = { a:'a', aa:'aa', i:'i', ii:'ii', ue:'ɯ', uue:'ɯɯ', u:'u', uu:'uu', e:'e', ee:'ee', ae:'ɛ', aae:'ɛɛ',
    o:'o', oo:'oo', or:'ɔ', oor:'ɔɔ', oe:'ɤ', ooe:'ɤɤ', ia:'ia', uea:'ɯa', ua:'ua', am:'am', ai:'ai', ao:'ao' };
  const VZ = { a:'ㄚ', aa:'ㄚ', i:'ㄧ', ii:'ㄧ', ue:'ㄜ', uue:'ㄜ', u:'ㄨ', uu:'ㄨ', e:'ㄝ', ee:'ㄝ', ae:'ㄝ', aae:'ㄝ',

  // 泰／寮共用：一行 → tokens
  function scriptAnalyze(line, cfg, dict) {
    const out = [];

    let k = 0;
    while (k < chars.length) {
      const ch = chars[k];
      if (/\s/.test(ch)) { if (out.length && out[out.length - 1].type !== 'space') out.push({ type: 'space' }); k++; continue; }
      if (!cfg.inScript(ch)) {
        let t = ''; while (k < chars.length && !cfg.inScript(chars[k]) && !/\s/.test(chars[k])) t += chars[k++];
        out.push({ type: 'punct', text: t }); continue;
      }
      let w = ''; while (k < chars.length && cfg.inScript(chars[k])) w += chars[k++];
      out.push({ type: 'word', syl: sylChunk(w, cfg, dict) });
    }
    return out;

  function sylChunk(w, cfg, dict) {

      if (cfg.repeat && w[i] === cfg.repeat) { syl.push({ orig: w[i], roman: '·', zy: '·' }); i++; continue; }

      if (!p || p.end <= i) { syl.push({ orig: w[i], roman: '', zy: '' }); i++; continue; }

    }

  }

  const THAI = { inScript: c => c >= 'ก' && c <= '๛' && c !== 'ๆ' && c !== 'ฯ', syl: thSyl, repeat: null };
  const LAO = { inScript: c => c >= 'ກ' && c <= 'ໟ' && c !== 'ໆ', syl: loSyl, repeat: null };

  // ---------- 西班牙文 ----------
  const ES_V = 'aeiouáéíóúü';
  function esUnits(w) {
    const lw = w.toLowerCase(), U = [];
    let i = 0;
    while (i < lw.length) {
      const c = lw[i], two = lw.substr(i, 2);
      if (two === 'ch' || two === 'll' || two === 'rr') { U.push({ t: two, o: w.substr(i, 2), v: false }); i += 2; continue; }
      if ((c === 'q' || c === 'g') && lw[i + 1] === 'u' && /[eéií]/.test(lw[i + 2] || '')) { U.push({ t: c + 'u', o: w.substr(i, 2), v: false }); i += 2; continue; }
      if (c === 'y') { U.push({ t: 'y', o: w[i], v: !ES_V.includes(lw[i + 1] || '#') }); i++; continue; }
      U.push({ t: c, o: w[i], v: ES_V.includes(c) }); i++;
    }
    return U;
  }
  const esStrong = t => /[aeoáéóíú]/.test(t);
  const esInsep = (a, b) => /^[bcfgkpdt]$/.test(a) && /^[lr]$/.test(b) && !(a === 'd' && b === 'l') && !(a === 't' && b === 'l');
  function esSyllables(w) {
    const U = esUnits(w);
    const nuclei = [], gaps = [[]];
    U.forEach(u => {
      if (u.v) {
        const lastGap = gaps[gaps.length - 1];
        const prevNuc = nuclei[nuclei.length - 1];
        if (prevNuc && lastGap.length === 0 && !(esStrong(prevNuc[prevNuc.length - 1].t) && esStrong(u.t))) prevNuc.push(u);
        else { nuclei.push([u]); gaps.push([]); }
      } else gaps[gaps.length - 1].push(u);
    });
    if (!nuclei.length) return null;
    const S = nuclei.map(nu => ({ on: [], nu, co: [] }));
    S[0].on = gaps[0];
    S[S.length - 1].co = gaps[gaps.length - 1];
    for (let k = 0; k < S.length - 1; k++) {
      const C = gaps[k + 1];
      if (C.length === 1) S[k + 1].on = C;
      else if (C.length === 2) { if (esInsep(C[0].t, C[1].t)) S[k + 1].on = C; else { S[k].co = [C[0]]; S[k + 1].on = [C[1]]; } }
      else if (C.length === 3) { if (esInsep(C[1].t, C[2].t)) { S[k].co = [C[0]]; S[k + 1].on = [C[1], C[2]]; } else { S[k].co = [C[0], C[1]]; S[k + 1].on = [C[2]]; } }
      else if (C.length > 3) { S[k].co = C.slice(0, 2); S[k + 1].on = C.slice(2); }
    }
    let stress = S.findIndex(s => s.nu.some(u => /[áéíóú]/.test(u.t)));
    if (stress < 0) {
      const last = w.toLowerCase().slice(-1);
      stress = (S.length > 1 && /[aeiouns]/.test(last)) ? S.length - 2 : S.length - 1;
    }
    return S.map((s, k) => ({ s, st: k === stress }));
  }
  const ES_NUC = { a:'ㄚ', e:'ㄝ', i:'ㄧ', o:'ㄛ', u:'ㄨ', ai:'ㄞ', ei:'ㄟ', oi:'ㄛㄧ', au:'ㄠ', eu:'ㄝㄨ', ou:'ㄛㄨ',
    ia:'ㄧㄚ', ie:'ㄧㄝ', io:'ㄧㄛ', iu:'ㄧㄨ', ua:'ㄨㄚ', ue:'ㄨㄝ', uo:'ㄨㄛ', ui:'ㄨㄟ', iai:'ㄧㄞ', iei:'ㄧㄟ', uai:'ㄨㄞ', uei:'ㄨㄟ' };
  function esOnset(t, front) {
    switch (t) {
      case 'b': case 'v': return 'ㄅ';
      case 'c': return front ? 'ㄙ' : 'ㄍ';
      case 'g': return front ? 'ㄏ' : 'ㄍ';
      case 'ch': return 'ㄑ';
      case 'd': case 't': return 'ㄉ';
      case 'f': return 'ㄈ';
      case 'gu': case 'qu': case 'k': return 'ㄍ';
      case 'h': return '';
      case 'j': return 'ㄏ';
      case 'l': case 'r': case 'rr': return 'ㄌ';
      case 'll': case 'y': return 'ㄧ';
      case 'm': return 'ㄇ';
      case 'n': return 'ㄋ';
      case 'ñ': return 'ㄋㄧ';
      case 'p': return 'ㄅ';
      case 's': case 'z': return 'ㄙ';
      case 'w': return 'ㄨ';
      case 'x': return 'ㄎㄙ';
    }
    return '';
  }
  const ES_CODA = { s:'ˢ', z:'ˢ', l:'ˡ', r:'ʳ', d:'ᵈ', m:'ᵐ', c:'ᵏ', k:'ᵏ', g:'ᵏ', p:'ᵖ', b:'ᵖ', t:'ᵗ', x:'ᵏˢ', j:'ʰ', f:'ᶠ' };
  function esZy(sy) {
    const nuText = sy.nu.map(u => u.t).join('').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/y/g, 'i');
    let v = ES_NUC[nuText] || nuText.split('').map(c => ES_NUC[c] || '').join('');
    const front = /^[ei]/.test(nuText);
    let on = sy.on.map((u, k) => esOnset(u.t, front && k === sy.on.length - 1)).join('');
    if (on.endsWith('ㄑ') && v[0] !== 'ㄧ') on += 'ㄧ';
    if (on.endsWith('ㄧ') && v[0] === 'ㄧ') on = on.slice(0, -1);
    if (on.endsWith('ㄙ') && v[0] === 'ㄧ') on = on.slice(0, -1) + 'ㄒ';
    sy.co.forEach(u => {
      if (u.t === 'n') {
        const last = v[v.length - 1];
        if (last === 'ㄚ') v = v.slice(0, -1) + 'ㄢ';
        else if (last === 'ㄧ' || last === 'ㄨ') v += 'ㄣ';
        else v += 'ⁿ';
      } else v += ES_CODA[u.t] || '';
    });
    return on + v;
  }
  function esAnalyze(line) {
    const out = [];
    const re = /([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)|(\s+)|([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ\s]+)/g;
    let m;

      if (m[2]) { if (out.length && out[out.length - 1].type !== 'space') out.push({ type: 'space' }); }
      else if (m[3]) out.push({ type: 'punct', text: m[3] });
      else {
        const S = esSyllables(m[1]);
        if (!S) { out.push({ type: 'punct', text: m[1] }); continue; }
        out.push({ type: 'word', syl: S.map(({ s, st }) => ({
          orig: s.on.concat(s.nu, s.co).map(u => u.o).join(''), roman: '', zy: esZy(s), st
        })) });
      }
    }
    return out;
  }

  root.MultiPron = {
    th: (line, fix) => scriptAnalyze(line, THAI, makeDict(TH_DICT, fix)),
    lo: (line, fix) => scriptAnalyze(line, LAO, makeDict({}, fix)),
    es: line => esAnalyze(line)
  };
  if (typeof module !== 'undefined') module.exports = root.MultiPron;

</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = {
    // 存過 null 的鍵（例如存完詩歌後清空的草稿）也要回預設值，否則表單會崩潰
    get(k, d){ try { const v = localStorage.getItem(k); if (v == null) return d; const p = JSON.parse(v); return p == null ? d : p; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2000); }

  // ---------- 語言 ----------
  const LANGS = {
    ko: { name:'韓文', tts:'ko', eng: t => KoPron.analyze(t), sylJoin:'', pron:true,
          legend:'<b class="k">韓文</b><b class="p">實際發音</b><b class="r">羅馬拼音</b><b class="z">注音近似</b>',
          ph:'1\n첫째 줄\n둘째 줄\n\n후렴\n…' },
    th: { name:'泰文', tts:'th', eng: (t, fx) => MultiPron.th(t, fx), sylJoin:' ', fix:true,
          legend:'<b class="k">泰文</b><b class="r">拼音（含聲調）</b><b class="z">注音近似</b><span>聲調：無標＝中平　ˇ＝低　ˋ＝降　ˉ＝高　ˊ＝升</span>',
          ph:'1\nบรรทัดแรก\nบรรทัดที่สอง', fixPh:'สวรรค์ = สะ หวัน\nบริ|สุทธิ์ = บอ ริ สุด' },
    lo: { name:'寮文', tts:'lo', eng: (t, fx) => MultiPron.lo(t, fx), sylJoin:' ', fix:true,
          legend:'<b class="k">寮文</b><b class="r">拼音</b><b class="z">注音近似</b><span>寮語各地聲調差異大，目前未標聲調。</span>',
          ph:'1\nແຖວທຳອິດ\nແຖວທີສອງ', fixPh:'ພຣະ = ພະ' },
    es: { name:'西班牙文', tts:'es', eng: t => MultiPron.es(t), sylJoin:'-', noRoman:true,
          legend:'<b class="k">西班牙文（粗體底線＝重音節）</b><b class="z">注音近似</b>',
          ph:'1\nPrimera línea\nSegunda línea' }
  };
  const LANG_KEYS = Object.keys(LANGS);

  // ---------- 設定 ----------
  const prefs = Object.assign({ zh:true, p:true, r:true, z:true, mode:'syl', scale:1, rate:0.8, lang:'ko' }, store.get('kh-prefs', {}));
  if (!LANGS[prefs.lang]) prefs.lang = 'ko';
  function applyPrefs(){
    document.body.classList.toggle('hide-zh', !prefs.zh);
    document.body.classList.toggle('hide-p', !prefs.p);
    document.body.classList.toggle('hide-r', !prefs.r);
    document.body.classList.toggle('hide-z', !prefs.z);
    document.documentElement.style.setProperty('--scale', prefs.scale);
    store.set('kh-prefs', prefs);
  }
  applyPrefs();

  // ---------- 資料（相容舊的韓文格式） ----------
  function norm(h){
    return {
      id: h.id, lang: LANGS[h.lang] ? h.lang : 'ko',
      zhNo: h.zhNo || '', no: h.no != null ? h.no : (h.koNo || ''),
      zhTitle: h.zhTitle || '', title: h.title != null ? h.title : (h.koTitle || ''),
      fix: h.fix || '',
      verses: (h.verses || []).map(v => ({ label: v.label, lines: (v.lines || []).map(l => ({ zh: l.zh || '', t: l.t != null ? l.t : (l.ko || '') })) }))
    };
  }
  let builtIn = [];
  let local = store.get('kh-local', []).map(norm);
  const ENC = window.HYMNS_ENC || null;
  const all = () => {
    const ids = new Set(local.map(h => h.id));
    return builtIn.filter(h => !ids.has(h.id)).concat(local.map(h => Object.assign({}, h, { _src:'local' })));
  };
  const find = id => all().find(h => h.id === id);

  // ---------- 加密 ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pw, salt){
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  }
  async function encryptList(list, pw){
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt);
    const data = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(list))));
    return { v:1, salt:b64(salt), iv:b64(iv), data:b64(data) };
  }
  async function decryptList(enc, pw){
    const key = await deriveKey(pw, unb64(enc.salt));
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
    return JSON.parse(td.decode(plain));
  }
  let password = null;
  async function tryUnlock(pw){
    if (ENC){ builtIn = (await decryptList(ENC, pw)).map(h => Object.assign(norm(h), { _src:'site' })); }
    password = pw;
  }
  function lock(){
    password = null; builtIn = [];
    try { localStorage.removeItem('kh-pw'); sessionStorage.removeItem('kh-pw'); } catch(e){}
    location.hash = ''; route();
  }
  function viewLock(){
    app.innerHTML =
      '<div class="help" style="margin-top:8px">' + (ENC ? '這個頁面已上鎖，請輸入密碼。' : '第一次使用：請設定一組密碼。之後下載的 hymns.js 會用這組密碼加密，網站上沒有密碼的人看不到內容。') + '</div>' +
      '<div class="form" style="margin-top:12px;max-width:360px">' +
      '<div><label>密碼</label><input type="text" id="pw" autocomplete="current-password" style="-webkit-text-security:disc"></div>' +
      (ENC ? '' : '<div><label>再輸入一次</label><input type="text" id="pw2" style="-webkit-text-security:disc"></div>') +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="remember"> 在這台裝置記住密碼</label>' +
      '<div class="btns"><button class="btn" id="b-unlock">' + (ENC ? '解鎖' : '設定密碼') + '</button></div>' +
      '<p class="note" id="pw-msg"></p></div>';
    const go = async () => {
      const pw = $('#pw').value;
      if (!pw){ $('#pw-msg').textContent = '請輸入密碼'; return; }
      if (!ENC && pw !== $('#pw2').value){ $('#pw-msg').textContent = '兩次輸入的密碼不一樣'; return; }
      $('#pw-msg').textContent = '解鎖中…';
      try {
        await tryUnlock(pw);
        try { ($('#remember').checked ? localStorage : sessionStorage).setItem('kh-pw', pw); } catch(e){}
        route();
      } catch(e){ $('#pw-msg').textContent = '密碼不對'; }
    };
    $('#b-unlock').onclick = go;
    app.querySelectorAll('input[type=text]').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  }

  // ---------- 朗讀 ----------
  function voiceFor(lang){
    if (!('speechSynthesis' in window)) return null;
    const pre = LANGS[lang].tts;
    return speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').split('-')[0] === pre) || null;
  }
  if ('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
  let speakingBtn = null;
  function speak(text, lang, btn){
    if (!('speechSynthesis' in window)) { toast('這個瀏覽器不支援語音朗讀'); return; }
    speechSynthesis.cancel();
    if (speakingBtn) speakingBtn.classList.remove('speaking');
    if (btn && btn === speakingBtn) { speakingBtn = null; return; }
    const voice = voiceFor(lang);
    if (!voice && lang === 'lo') { toast('這台裝置沒有寮語語音'); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = ({ ko:'ko-KR', th:'th-TH', lo:'lo-LA', es:'es-ES' })[lang]; u.rate = prefs.rate;
    if (voice) u.voice = voice;
    if (btn){ btn.classList.add('speaking'); speakingBtn = btn; }
    u.onend = () => { if (btn) btn.classList.remove('speaking'); if (speakingBtn === btn) speakingBtn = null; };
    u.onerror = () => { if (btn) btn.classList.remove('speaking'); if (speakingBtn === btn) speakingBtn = null; toast('朗讀出錯：這台裝置可能還沒有' + LANGS[lang].name.replace('文','語') + '語音，請到系統設定加入'); };
    speechSynthesis.speak(u);
  }

  // ---------- 畫面 ----------
  function renderLine(line, lang, fix){
    const L = LANGS[lang];
    let toks = [];
    try { toks = L.eng(line.t || '', fix); } catch(e){ toks = [{ type:'punct', text: line.t || '' }]; }
    let body;
    if (prefs.mode === 'syl'){
      body = '<div class="syls">' + toks.map(t => {
        if (t.type === 'space') return '';

        return '<span class="w">' + t.syl.map(s =>
          '<span class="s' + (s.st ? ' st' : '') + '" data-say="' + esc(s.orig) + '"><span class="h">' + (esc(s.orig) || '&nbsp;') + '</span>' +
          (L.pron ? '<span class="p">' + (s.pron && s.pron !== s.orig ? esc(s.pron) : '&nbsp;') + '</span>' : '') +
          (L.noRoman ? '' : '<span class="r">' + (esc(s.roman) || '&nbsp;') + '</span>') +
          '<span class="z">' + (esc(s.zy) || '&nbsp;') + '</span></span>'
        ).join('') + '</span>';
      }).join('') + '</div>';
    } else {
      const join = (f, sep, gap) => toks.map(t => t.type === 'word' ? t.syl.map(f).filter(Boolean).join(sep) : t.type === 'space' ? gap : t.text).join('');
      const pron = L.pron ? join(s => s.pron, '', ' ') : '';
      body = '<div class="flat"><span class="h">' + esc(line.t) + '</span>' +
        (L.pron && pron !== line.t ? '<span class="p">［' + esc(pron) + '］</span>' : '') +
        (L.noRoman ? '' : '<span class="r">' + esc(join(s => s.roman, L.sylJoin, L.sylJoin ? '  ' : ' ')) + '</span>') +

    }
    return '<div class="ln">' + (line.zh ? '<div class="zh">' + esc(line.zh) + '</div>' : '') + body +

  }
  function renderVerses(h){
    return (h.verses || []).map(v =>

  }

  function renderLangs(active, locked){

  function viewList(){

      .filter(h => !q || [h.zhNo, h.no, h.zhTitle, h.title].join(' ').toLowerCase().includes(q))
      .sort((a, b) => (parseInt(a.no) || 1e9) - (parseInt(b.no) || 1e9) || String(a.no).localeCompare(String(b.no)));

      '<div class="btns" style="margin-bottom:10px"><button class="btn" id="b-add">＋ 新增' + LANGS[prefs.lang].name + '詩歌</button></div>' +
      '<div style="display:flex;gap:8px"><input type="search" id="q" placeholder="搜尋號碼或標題" value="' + esc(viewList.q || '') + '"><button class="chip-btn" id="b-lock" title="上鎖">🔒 上鎖</button></div>' +
      (items.length ? '<ul class="list">' + items.map(h =>
        '<li><a href="#h=' + encodeURIComponent(h.id) + '"><span class="no">' + esc(h.no || h.zhNo || '') + '</span>' +
        '<span><div>' + esc(h.zhTitle) + (h.zhNo ? ' <small style="color:var(--muted)">（中 ' + esc(h.zhNo) + '）</small>' : '') + '</div><div class="ko">' + esc(h.title) + '</div></span>' +
        (h._src === 'local' ? '<span class="tag">本機</span>' : '') + '</a></li>').join('') + '</ul>'
      : '<p class="empty">還沒有' + LANGS[prefs.lang].name + '詩歌。到「新增詩歌」貼上歌詞就能產生對照。</p>');
    $('#b-lock').onclick = lock;
    $('#b-add').onclick = () => {
      try { location.hash = 'edit'; route(); }
      catch (e) { app.innerHTML = '<p class="empty">新增表單載入失敗，請截圖給我：' + esc(e && e.message ? e.message : String(e)) + '</p>'; }
    };
    const qi = $('#q');
    qi.oninput = () => { viewList.q = qi.value; const pos = qi.selectionStart; viewList(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function toolbarHTML(L){
    const b = (k, label) => '<button class="chip-btn' + (prefs[k] ? ' on' : '') + '" data-pref="' + k + '">' + label + '</button>';
    return '<div class="toolbar">' +
      '<button class="chip-btn' + (prefs.mode === 'syl' ? ' on' : '') + '" data-mode="syl">逐字</button>' +
      '<button class="chip-btn' + (prefs.mode === 'flat' ? ' on' : '') + '" data-mode="flat">整句</button>' +

  // ---------- 新增詩歌 ----------
  const LABEL_RE = /^\s*(\d+|副歌?|후렴|C|chorus|coro|estribillo|ร้องรับ|ສ້ອຍ)\s*[\.、:：)）]?\s*(.*)$/i;
  const LABEL_ONLY = /^\s*(\d+|副歌?|후렴|C|chorus|coro|estribillo|ร้องรับ|ສ້ອຍ)\s*[\.、:：)）]?\s*$/i;
  function parseLyrics(text){
    const raw = String(text || '').replace(/\r/g, '').split('\n').map(s => s.trim());
    const blocks = []; let cur = null;
    for (const ln of raw){
      if (!ln){ cur = null; continue; }
      if (LABEL_ONLY.test(ln)){ cur = [ln]; blocks.push(cur); continue; }
      if (!cur){ cur = []; blocks.push(cur); }
      cur.push(ln);
    }
    let auto = 0;
    return blocks.filter(b => b.length).map(lines => {
      let label = null;
      const m = lines[0].match(LABEL_RE);
      if (m){ label = /^\d+$/.test(m[1]) ? m[1] : '副'; if (m[2]) lines[0] = m[2]; else lines.shift(); }
      if (!label) label = String(++auto); else if (/^\d+$/.test(label)) auto = +label;
      return { label, lines };
    }).filter(v => v.lines.length);
  }
  // 貼上自動清理：去掉網址行、把開頭的標題／編號抽到欄位、壓掉連續空行；不改歌詞本身
  function isLabelLine(ln){ return LABEL_ONLY.test(ln) || LABEL_RE.test(ln); }
  function cleanPasted(text){
    const lines = [];
    let urlRemoved = 0;
    for (const ln of String(text || '').replace(/\r/g, '').split('\n')){
      const t = ln.trim();
      if (/^(https?:\/\/|www\.)\S*$/i.test(t)){ urlRemoved++; continue; }
      lines.push(t);
    }
    while (lines.length && !lines[0]) lines.shift();
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    let header = null;
    const firstLabelIdx = lines.findIndex(ln => ln && /^\s*(\d+|副歌?|후렴|C|chorus|coro|estribillo|ร้องรับ|ສ້ອຍ)\s*[\.、:：)）]?\s*$/i.test(ln));
    if (firstLabelIdx > 0){
      if (!lines.slice(0, firstLabelIdx).includes('')){ header = lines.slice(0, firstLabelIdx).join(' '); lines.splice(0, firstLabelIdx); }
      else {
        const firstBlank = lines.indexOf('');
        if (firstBlank === 1){ header = lines[0]; lines.splice(0, 2); }
      }
    }
    const out = []; let prevBlank = false;
    for (const ln of lines){ if (!ln){ if (!prevBlank) out.push(''); prevBlank = true; } else { out.push(ln); prevBlank = false; } }
    while (out.length && !out[0]) out.shift();
    while (out.length && out[out.length - 1] === '') out.pop();
    let headerKind = null;
    if (header){ const h = header.trim(); header = h; headerKind = (/^(大本|小本|補充本)/.test(h) || (/^[^\s]{1,8}$/.test(h) && /\d/.test(h))) ? 'number' : 'title'; }
    return { text: out.join('\n'), header, headerKind, urlRemoved };
  }
  function applyClean(textarea, isTarget){
    const res = cleanPasted(textarea.value);
    const titleEl = document.querySelector(isTarget ? '#f-title' : '#f-zhTitle');
    const noEl = document.querySelector(isTarget ? '#f-no' : '#f-zhNo');
    let applied = null;
    if (res.header){
      if (res.headerKind === 'number' && noEl && !noEl.value.trim()){ noEl.value = res.header; applied = 'number'; }
      else if (res.headerKind === 'title' && titleEl && !titleEl.value.trim()){ titleEl.value = res.header; applied = 'title'; }
    }
    if (applied) textarea.value = res.text;
    else if (res.header) textarea.value = res.header + '\n\n' + res.text;
    else textarea.value = res.text;
    return { applied, urlRemoved: res.urlRemoved };
  }
  function group(arr, j, n, sep){
    if (!arr.length) return '';
    if (arr.length <= n) return arr[j] || '';
    return arr.slice(Math.floor(j * arr.length / n), Math.floor((j + 1) * arr.length / n)).join(sep);
  }
  function buildHymn(f){
    const zv = parseLyrics(f.zh), tv = parseLyrics(f.t);
    const n = Math.max(zv.length, tv.length);
    const verses = [];
    for (let i = 0; i < n; i++){
      const z = zv[i] || { lines:[] }, k = tv[i] || { lines:[] };
      const zl = z.lines, kl = k.lines;
      const m = (zl.length && kl.length) ? Math.min(zl.length, kl.length) : Math.max(zl.length, kl.length);
      const lines = [];
      for (let j = 0; j < m; j++) lines.push({ zh: group(zl, j, m, ''), t: group(kl, j, m, ' ') });
      verses.push({ label: (k.label || z.label || String(i + 1)), lines });
    }
    const id = f.id || (f.lang + '-' + String(f.no || f.zhNo || Date.now()).replace(/\W+/g, '') + '-' + Date.now().toString(36));
    return { id, lang: f.lang, zhNo: f.zhNo, no: f.no, zhTitle: f.zhTitle, title: f.title, fix: f.fix || '', verses };
  }
  function versesToText(h, key){
    return (h.verses || []).map(v => v.label + '\n' + v.lines.map(l => l[key]).join('\n')).join('\n\n');
  }
  function downloadFile(name, text){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type:'text/javascript' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function cleanForExport(h){ const c = Object.assign({}, h); delete c._src; return c; }

      (L.fix ? '<div><label>發音修正（選填）：自動發音不對的字，每行寫「原字 = 正確拼法」，音節用空格分開</label><textarea class="small" id="f-fix" placeholder="' + esc(L.fixPh) + '">' + esc(v.fix) + '</textarea></div>' : '') +
      '<div class="btns"><button class="btn" id="b-save">存到這台裝置</button>' +
      '<button class="btn ghost" id="b-dl">下載加密的 hymns.js（含全部詩歌）</button>' +
      '<button class="btn ghost" id="b-clean">自動清理貼上的文字</button>' +
      '<button class="btn ghost" id="b-clear">清空</button></div>' +
      '<p class="note">「存到這台裝置」只有你這支手機／電腦看得到。要放上網站，按「下載加密的 hymns.js」，再上傳到 GitHub 的 hymns 資料夾覆蓋同名檔案；網站上只有知道密碼的人能打開。</p>' +
      '</div><h3 style="margin-top:22px">預覽</h3><div class="legend">' + L.legend + '</div><div id="preview"></div>';
    const ids = ['zhNo','no','zhTitle','title','zh','t'].concat(L.fix ? ['fix'] : []);
    const read = () => { const f = { id: v.id, lang }; ids.forEach(k => f[k] = $('#f-' + k).value.trim()); return f; };
    const preview = () => {
      const f = read(); if (!editId) store.set(dkey, f);

    };
    let tmr = null;
    ids.forEach(k => $('#f-' + k).addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(preview, 150); }));
    preview();
    const cleanOne = (key, isTarget) => {
      const r = applyClean($('#f-' + key), isTarget);
      if (r.applied === 'title') toast('已把開頭標題移到標題欄');
      else if (r.applied === 'number') toast('已把開頭編號移到號碼欄');
      else if (r.urlRemoved) toast('已去掉貼上文字裡的網址行');

      const hh = buildHymn(f);
      local = local.filter(x => x.id !== hh.id).concat([hh]);
      store.set('kh-local', local);
      if (!editId) store.set(dkey, null);

      list = list.filter(x => x.id !== 'demo');
      const enc = await encryptList(list, password);
      downloadFile('hymns.js', '// 主恢復詩歌 多語對照資料（已加密，需密碼才能在網頁上開啟）\nwindow.HYMNS_ENC = ' + JSON.stringify(enc) + ';\n');
      toast('已用目前的密碼加密，共 ' + list.length + ' 首');
    };

    app.onclick = e => { const t = e.target.closest('.play,.s'); if (!t) return; if (t.dataset.line) speak(t.dataset.line, lang, t); else if (t.dataset.say) speak(t.dataset.say, lang); };
  }

  // ---------- 批次貼上 ----------
  // 拆首規則（依序）：
  // 1) 自己加的分隔線 === 或 ---；2) 網址行（app 分享的文字通常最後附網址）；
  // 3) 帶前綴或後綴的號碼行，例如「大本 12」「韓文 12」「찬송 12」「12장」「#12」「第12首」。
  //    單獨一個數字視為節號，不拿來拆首。
  const B_SEP = /^\s*(={3,}|-{3,}|＝{3,}|—{2,}|_{3,})\s*$/;
  const B_URL = /^(https?:\/\/|www\.)\S*$/i;
  const B_HEAD = /^\s*(?:(大本|小本|補充本|新詩歌|韓文|中文|泰文|寮文|西班牙文|詩歌|찬송가|찬송|찬양|hymn|himno|no\.?|เพลง|ເພງ|#)\s*(?:第\s*)?(\d{1,4})\s*(?:首|장|번)?|第\s*(\d{1,4})\s*首|(\d{1,4})\s*(?:장|번|首))\s*$/i;
  function headNum(ln){
    const m = ln.match(B_HEAD); if (!m) return null;
    const num = m[2] || m[3] || m[4];
    return { num: (m[1] && /^(大本|小本|補充本|新詩歌)$/.test(m[1])) ? m[1] + ' ' + num : num, text: ln.trim() };
  }
  function splitBatch(text){
    const items = []; let cur = null;
    const close = () => { if (cur && cur.lines.some(l => l.trim())) items.push(cur); cur = null; };
    const ensure = () => { if (!cur) cur = { head: null, lines: [] }; };
    for (const raw of String(text || '').replace(/\r/g, '').split('\n')){
      const ln = raw.trim();
      if (B_SEP.test(ln)){ close(); continue; }
      if (B_URL.test(ln)){ close(); continue; }
      const h = ln && headNum(ln);
      if (h){
        if (cur && cur.lines.some(l => l.trim())) close();
        ensure(); cur.head = h; continue;
      }
      ensure(); cur.lines.push(ln);
    }
    close();
    return items.map(it => {
      const res = cleanPasted(it.lines.join('\n'));
      let title = '', no = it.head ? it.head.num : '';
      let text = res.text;
      if (res.header){ if (res.headerKind === 'number' && !no) no = (res.header.match(/\d+/) || [''])[0]; else if (res.headerKind === 'title') title = res.header; }
      const first = parseLyrics(text).map(v => v.lines[0]).find(Boolean) || '';
      return { no, headText: it.head ? it.head.text : '', title, text, first, verses: parseLyrics(text).length };
    });
  }

      '<div><label>中文詩歌（多首）</label><textarea id="b-zh" style="min-height:260px">' + esc(d.zh) + '</textarea></div></div>' +

    const save = () => store.set(bkey, { t: $('#b-t').value, zh: $('#b-zh').value });

    let T = [], Z = [];

      Z.map((z, j) => '<option value="' + j + '"' + (j === sel ? ' selected' : '') + '>中 ' + (j + 1) + (z.no ? '（' + esc(z.no) + '）' : '') + '：' + esc(z.first.slice(0, 18)) + '</option>').join('');
    function check(i){

      else { el.className = 'b-chk ok'; el.textContent = '節數相同（' + t.verses + ' 節）'; }

    $('#b-split').onclick = () => {

        T.map((t, i) => {
          const ex = existingFor(t.no);
          return '<div class="bcard" data-i="' + i + '">' +
            '<div class="bhead"><span class="bidx">第 ' + (i + 1) + ' 首</span>' +

            '<div class="row form" style="gap:8px"><div><label>' + L.name + '號碼</label><input type="text" class="b-no" value="' + esc(t.no) + '"></div>' +
            '<div><label>' + L.name + '標題</label><input type="text" class="b-title" value="' + esc(t.title || t.first) + '"></div></div>' +
            '<div class="first">' + L.name + '第一句：<b>' + esc(t.first) + '</b>（' + t.verses + ' 節）</div>' +
            '<div style="margin-top:8px"><label style="font-size:.85em;color:var(--muted)">配對的中文詩歌</label><select class="b-zsel">' + zOpt(i < Z.length ? i : -1) + '</select></div>' +
            '<div class="row form" style="gap:8px;margin-top:8px"><div><label>中文號碼</label><input type="text" class="b-zno"></div>' +
            '<div><label>中文標題</label><input type="text" class="b-ztitle" placeholder="空白就用中文第一句"></div></div>' +
            '<div class="first b-zfirst"></div><div class="b-chk"></div>' +
            (ex ? '<div class="warn">這個號碼已經有一首「' + esc(ex.title || ex.zhTitle) + '」，存檔會覆蓋它。</div>' : '') +
            '</div>';
        }).join('') +
        '<div class="btns"><button class="btn" id="b-saveall">全部存到這台裝置</button></div>' +
        '<p class="note">存好後可以到目錄逐首打開檢查；要放上網站，再到「新增詩歌」按「下載加密的 hymns.js」。</p>';
      T.forEach((_, i) => check(i));
      app.querySelectorAll('.bcard').forEach(c => {
        c.querySelector('.b-zsel').onchange = () => { c.querySelector('.b-zno').dataset.touched = ''; delete c.querySelector('.b-zno').dataset.touched; check(+c.dataset.i); };
        c.querySelector('.b-zno').oninput = e => { e.target.dataset.touched = '1'; };
      });
      $('#b-saveall').onclick = () => {
        let n = 0;
        app.querySelectorAll('.bcard').forEach(c => {
          if (c.querySelector('.b-skip').checked) return;
          const t = T[+c.dataset.i], z = Z[+c.querySelector('.b-zsel').value];
          const no = c.querySelector('.b-no').value.trim();
          const ex = existingFor(no);
          const hh = buildHymn({
            id: ex ? ex.id : '', lang, no, title: c.querySelector('.b-title').value.trim(),
            zhNo: c.querySelector('.b-zno').value.trim(),
            zhTitle: c.querySelector('.b-ztitle').value.trim() || (z ? z.first : ''),
            fix: ex ? ex.fix : '', t: t.text, zh: z ? z.text : ''
          });
          local = local.filter(x => x.id !== hh.id).concat([hh]);
          n++;
        });
        store.set('kh-local', local);
        toast('已存 ' + n + ' 首到這台裝置');
        if (n){ store.set(bkey, null); location.hash = ''; }
      };
    };
  }

  // ---------- 路由 ----------
  function route(){
    const hs = location.hash.slice(1);
    const tab = hs.startsWith('edit') ? 'edit' : hs.startsWith('batch') ? 'batch' : 'list';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    app.onclick = null;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (password === null){ renderLangs(prefs.lang); viewLock(); return; }
    try {
      if (hs.startsWith('h=')) viewHymn(decodeURIComponent(hs.slice(2)));
      else if (hs.startsWith('edit=')) viewEdit(decodeURIComponent(hs.slice(5)));
      else if (hs.startsWith('edit')) viewEdit();
      else if (hs.startsWith('batch')) viewBatch();
      else viewList();
    } catch (e) {
      app.innerHTML = '<p class="empty">載入失敗，請截圖給我：' + esc(e && e.message ? e.message : String(e)) + '</p>';
    }
    window.scrollTo(0, 0);
  }
  // 網址已是目標時瀏覽器不觸發 hashchange，要直接重繪
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    const target = b.dataset.tab === 'list' ? '' : b.dataset.tab;
    if (location.hash.slice(1) === target) route(); else location.hash = target;
  });
  window.addEventListener('hashchange', route);
  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem('kh-pw') || localStorage.getItem('kh-pw'); } catch(e){}
    if (saved){ try { await tryUnlock(saved); } catch(e){ password = null; } }
    route();
  })();
})();
</script>
</body>
</html>
