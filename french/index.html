<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>法語學習</title><style>
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#FFFDF5;color:#2b2b2b}
header{background:#FFF6DE;padding:56px 20px 40px;text-align:center;border-bottom:4px solid #E8B84B}
h1{font-size:44px;margin:0 0 12px}p.lead{font-size:18px;color:#555;max-width:700px;margin:0 auto;line-height:1.7}
main{max-width:1020px;margin:0 auto;padding:32px 20px 64px}
a.back{color:#86641A;text-decoration:none}
h2{font-size:28px;border-left:6px solid #86641A;padding-left:12px}
h3{font-size:20px;color:#86641A;margin:28px 0 10px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.tab{border:2px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:8px 20px;font-size:17px;cursor:pointer;font-family:inherit}
.tab.on{background:#E8B84B;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eee;border-top:4px solid #E8B84B;border-radius:14px;padding:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 8px 20px rgba(0,0,0,.14);transform:translateY(-3px)}
.card .k{font-size:15px;color:#86641A;font-weight:700}.card .t{font-size:18px;margin:6px 0}.card .d{font-size:14px;color:#666;line-height:1.6}
.box{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 20px;line-height:1.8}
.time{display:flex;border-radius:10px;overflow:hidden;font-size:13px;margin:10px 0}
.time div{padding:8px 6px;text-align:center;color:#5a4410;background:#FFF6DE;border-right:2px solid #fff}
.time div:nth-child(even){background:#FBE7B0}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee}
.tbl th{background:#FFF6DE;color:#86641A;text-align:left;padding:10px 12px;font-size:15px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid #f0e9d6;font-size:16px;line-height:1.6;vertical-align:top}
.fr{font-size:19px;color:#1d3b8a;cursor:pointer}.fr:hover{text-decoration:underline}
.fr::before{content:"🔊 ";font-size:13px}
.ipa{color:#7a5a12;font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;white-space:nowrap}
.phon{color:#555}
ul{margin:6px 0;padding-left:22px;line-height:1.8}
.nav{display:flex;justify-content:space-between;margin-top:32px;gap:10px}
.btn{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px;font-family:inherit}
.btn:disabled{opacity:.35;cursor:default}
.speed{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:14px;color:#86641A;margin:0 0 6px}
.speed button{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit}
.speed button.on{background:#E8B84B;color:#fff}
.note{background:#F3F7FF;border-left:4px solid #1d3b8a;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px;line-height:1.7}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;font-size:14px}
footer{text-align:center;color:#999;padding:24px;font-size:14px;line-height:1.8}
@media(max-width:600px){h1{font-size:32px}.tbl td,.tbl th{font-size:14px;padding:8px}.fr{font-size:17px}.time{font-size:11px}.ipa{white-space:normal}}
.tab.topic{border-color:#6AA84F;color:#3d7a22}.tab.topic.on{background:#6AA84F;color:#fff}
.card.tp{border-top-color:#6AA84F}.card.tp .k{color:#3d7a22}
.ans summary{cursor:pointer;padding:6px 0}.ans div{background:#FFF9EA;border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:15px}
.pat{background:#F1F8EC;border-left:4px solid #6AA84F}
</style></head><body>
<header><h1>法語學習</h1><p class="lead">入門、初級、中級、進階各 15 堂，共 60 堂，每堂 45 分鐘；另有 10 個法語會話專題。每個詞附國際音標（IPA）與中文近似音，藍色法文點一下就能聽發音。</p></header>
<main>
<p style="margin:0 0 16px"><a class="back" href="../">← 回首頁</a></p>
<div class="speed">朗讀速度：<button data-r="0.65">慢</button><button data-r="0.85" class="on">中</button><button data-r="1">正常</button></div>
<div id="app"></div>
</main>
<div id="toast"></div>
<footer>音標中的 ‿ 表示連誦（liaison），ˈ 不常用，因為法語重音固定在詞組最後一個音節。中文近似音只是輔助，請以點擊朗讀與老師發音為準。<br>朗讀會優先使用法國法語語音（fr-FR），若無聲音請在裝置設定中安裝法語語音。</footer>
<script src="lessons-1.js"></script>
<script src="lessons-2.js"></script>
<script src="lessons-3.js"></script>
<script src="lessons-4.js"></script>
<script src="topics.js"></script>
<script>
const LESSONS=window.LESSONS||[];
const PER=15,TOTAL=60;
const LEVELS=[["入門","第 1–15 堂：字母、母音與鼻母音、R 音、連誦、問候、自我介紹、數字、être／avoir"],["初級","第 16–30 堂：-er／-ir／-re 動詞、時間、作息、飲食、購物、問路、近未來式與複合過去式"],["中級","第 31–45 堂：未完成過去式、受詞代名詞、比較、反身動詞、未來式、條件式、旅行與看醫生"],["進階","第 46–60 堂：虛擬式、假設句、關係代名詞、愈過去式、被動語態、正式書信、演講與討論"]];
const TIME=[["0–5","暖身複習"],["5–15","發音／語法重點"],["15–27","詞彙"],["27–33","例句"],["33–40","對話練習"],["40–45","練習與作業"]];
const TPTIME=[["0–5","暖身"],["5–25","主題詞彙與句型"],["25–35","情境對話"],["35–42","角色扮演"],["42–45","回饋與作業"]];
const W=[5,10,12,6,7,5],TW=[5,20,10,7,3];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let frVoice=null,rate=0.85;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').startsWith('fr'));
  frVoice=vs.find(v=>/fr-fr/i.test(v.lang.replace('_','-')))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500);}
function speak(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g,', ').replace(/[（(].*?[)）]/g,'').replace(/…/g,', '));
  u.lang=frVoice?frVoice.lang:'fr-FR';u.rate=rate;if(frVoice)u.voice=frVoice;
  if(!frVoice)toast('找不到法語語音，可能用其他語音朗讀');
  speechSynthesis.speak(u);
}
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));});
app.addEventListener('click',e=>{const v=e.target.closest('.fr');if(v)speak(v.dataset.say||v.textContent);});
const fr=t=>`<span class="fr" data-say="${esc(t)}">${esc(t)}</span>`;
function tabs(cur){return `<div class="tabs">${LEVELS.map((l,i)=>`<button class="tab${i===cur?' on':''}" onclick="go('#lv${i}')">${l[0]}</button>`).join('')}<button class="tab topic${cur==='tp'?' on':''}" onclick="go('#topics')">💬 法語會話專題</button></div>`;}
function home(lv){
  lv=lv||0;
  let h=tabs(lv)+`<h2>${LEVELS[lv][0]}</h2><p style="color:#666">${LEVELS[lv][1]}</p>`;
  if(lv==0)h+=soundTable();
  h+=`<div class="grid">`;
  for(let i=lv*PER;i<lv*PER+PER;i++){const L=LESSONS[i];if(!L)continue;
    h+=`<div class="card" onclick="go('#L${i+1}')"><div class="k">第 ${i+1} 堂</div><div class="t">${esc(L.t)}</div><div class="d">${esc(L.g)}</div></div>`;}
  h+=`</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function soundTable(){
  const T=[["u","tu、rue","y","嘴唸「烏」、舌頭唸「衣」","就是國語的「ㄩ」（魚），和 ou 不同"],["ou","vous、nous","u","「烏」","嘴唇圓而突出"],["eu／œu","deux、sœur","ø／œ","「ㄜ」圓唇","閉音節（字尾有子音）時嘴巴張大一點"],["é／er／ez","été、parler、nez","e","「ㄝ」偏「ㄟ」但不滑","嘴角往兩旁拉"],["è／ê／ai","mère、fête、lait","ɛ","「ㄝ」","嘴巴比 é 張大"],["an／en","enfant、temps","ɑ̃","「昂」但不收 ng","鼻母音：氣從鼻子出，舌頭不碰上顎"],["on","bonjour、nom","ɔ̃","「翁」但不收 ng","嘴唇圓"],["in／ain／un","vin、pain、un","ɛ̃","「骯」偏「ㄝ」的鼻音","今日巴黎 un 多唸成和 in 一樣"],["r","rouge、Paris","ʁ","喉嚨後面輕輕「ㄏ」帶聲","像漱口；不是捲舌，也不是彈舌"],["ch／j","chat、je","ʃ／ʒ","「ㄒ」嘴圓／「ㄖ」嘴圓","嘴唇要往前突出"],["gn","montagne","ɲ","「ㄋㄧ」","像西語 ñ"],["h","homme、hôtel","—","不發音","分啞音 h 與噓音 h（後者不連誦）"],["字尾子音","petit、vous、parlent","—","通常不發音","例外常記 C R F L：avec、bonjour、neuf、sel"]];
  return `<h3>法語發音特色一覽</h3><div class="wrap"><table class="tbl"><thead><tr><th>字母</th><th>例字</th><th>IPA</th><th>近似音</th><th>說明</th></tr></thead><tbody>${T.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1].split('、').map(fr).join('　')}</td><td class="ipa">[${r[2]}]</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div><br>`;
}
function vocabTable(v){return `<div class="wrap"><table class="tbl"><thead><tr><th>法文</th><th>中文意思</th><th>IPA</th><th>中文近似音</th></tr></thead><tbody>${v.map(r=>`<tr><td>${fr(r[0])}</td><td>${esc(r[1])}</td><td class="ipa">[${esc(r[2])}]</td><td class="phon">${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`;}
function sentTable(s){const sp=s.some(r=>r[2]);return `<div class="wrap"><table class="tbl"><thead><tr><th>法文</th><th>中文</th>${sp?'<th>中文近似音</th>':''}</tr></thead><tbody>${s.map(r=>`<tr><td>${fr(r[0])}</td><td>${esc(r[1])}</td>${sp?`<td class="phon">${esc(r[2]||'')}</td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function dlgTable(d){return `<div class="wrap"><table class="tbl"><thead><tr><th>角色</th><th>法文</th><th>中文</th></tr></thead><tbody>${d.map(r=>`<tr><td>${esc(r[0])}</td><td>${fr(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;}
function lesson(n){
  const L=LESSONS[n-1];if(!L)return home(0);const lv=Math.floor((n-1)/PER);
  let h=tabs(lv)+`<p><a class="back" href="#lv${lv}">← ${LEVELS[lv][0]}課程列表</a></p>`;
  h+=`<h2>第 ${n} 堂　${esc(L.t)}</h2><div class="box"><b>學習目標：</b>${esc(L.g)}<br><b>時間：</b>45 分鐘</div>`;
  h+=`<h3>時間分配</h3><div class="time">${TIME.map((t,i)=>`<div style="flex:${W[i]}">${t[0]} 分<br>${t[1]}</div>`).join('')}</div>`;
  h+=`<h3>一、暖身複習（5 分鐘）</h3><div class="box">${n==1?'先聽老師用法語打招呼「Bonjour ! Ça va ?」，猜猜看是什麼意思；再介紹本課程：四個級別、60 堂、每堂 45 分鐘。':'複習第 '+(n-1)+' 堂的詞彙卡片，抽 3 人用上一堂的句型口頭回答。'}${L.c?`<div class="note"><b>文化小知識：</b>${esc(L.c)}</div>`:''}</div>`;
  h+=`<h3>二、發音／語法重點（10 分鐘）</h3><div class="box"><ul>${L.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<h3>三、詞彙（12 分鐘）</h3>`+vocabTable(L.v);
  h+=`<h3>四、例句（6 分鐘）</h3>`+sentTable(L.s)+(L.s.some(r=>r[2])?'<p style="color:#666;font-size:14px">近似音中的（連誦）表示前後字要連在一起唸，例如 vous avez 唸成「乎紮唯」。</p>':'');
  h+=`<h3>五、對話練習（7 分鐘）</h3>`+dlgTable(L.d)+`<p style="color:#666;font-size:14px">先全體跟讀，再兩人一組互換角色練習。</p>`;
  h+=`<h3>六、練習與作業（5 分鐘）</h3><div class="box"><b>課堂練習</b><ul>${L.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(L.x)h+=`<b>練習題（點開看答案）</b>${L.x.map((q,i)=>`<details class="ans"><summary>${i+1}. ${esc(q[0])}</summary><div>${esc(q[1])}</div></details>`).join('')}`;
  h+=`<b>回家作業：</b>${esc(L.h)}</div>`;
  h+=`<div class="nav"><button class="btn" ${n==1?'disabled':''} onclick="go('#L${n-1}')">← 上一堂</button><button class="btn" ${n==TOTAL?'disabled':''} onclick="go('#L${n+1}')">下一堂 →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function topicsHome(){
  const T=window.TOPICS||[];
  let h=tabs('tp')+`<h2>法語會話專題</h2><p style="color:#666">10 個生活與信仰情境，每個專題一堂 45 分鐘：主題詞彙、核心句型、情境對話與角色扮演。建議學完入門級後開始搭配使用。</p><div class="grid">`;
  T.forEach((t,i)=>{h+=`<div class="card tp" onclick="go('#tp${i+1}')"><div class="k">專題 ${i+1}　${t.icon}</div><div class="t">${esc(t.zh)}</div><div class="d"><span style="color:#1d3b8a">${esc(t.fr)}</span><br>${esc(t.desc)}</div></div>`;});
  app.innerHTML=h+`</div>`;window.scrollTo(0,0);
}
function topicView(n){
  const T=window.TOPICS||[],t=T[n-1];if(!t)return topicsHome();
  let h=tabs('tp')+`<p><a class="back" href="#topics">← 專題列表</a></p>`;
  h+=`<h2>專題 ${n}　${t.icon} ${esc(t.zh)}</h2><div class="box"><b>法文：</b>${fr(t.fr)}<br><b>內容：</b>${esc(t.desc)}<br><b>時間：</b>45 分鐘</div>`;
  h+=`<h3>時間分配</h3><div class="time">${TPTIME.map((x,i)=>`<div style="flex:${TW[i]}">${x[0]} 分<br>${x[1]}</div>`).join('')}</div>`;
  if(t.c)h+=`<div class="note"><b>文化小知識：</b>${esc(t.c)}</div>`;
  h+=`<h3>核心句型</h3><div class="box pat">`+sentTable(t.pat)+`</div>`;
  t.b.forEach((b,i)=>{h+=`<h3>${i+1}. ${b.icon} ${esc(b.zh)}</h3>`+vocabTable(b.w)+`<div style="height:8px"></div>`+sentTable(b.s);});
  h+=`<h3>情境對話</h3>`+dlgTable(t.d)+`<p style="color:#666;font-size:14px">先全體跟讀，再兩人一組互換角色。</p>`;
  h+=`<h3>角色扮演與作業</h3><div class="box"><ul>${t.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>回家作業：</b>${esc(t.h)}</div>`;
  h+=`<div class="nav"><button class="btn" ${n==1?'disabled':''} onclick="go('#tp${n-1}')">← 上一個專題</button><button class="btn" ${n==T.length?'disabled':''} onclick="go('#tp${n+1}')">下一個專題 →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(h){location.hash=h;}
function route(){const h=location.hash;let m;
  if((m=h.match(/^#L(\d+)$/)))lesson(+m[1]);
  else if(h==='#topics')topicsHome();
  else if((m=h.match(/^#tp(\d+)$/)))topicView(+m[1]);
  else if((m=h.match(/^#lv(\d)$/)))home(+m[1]);else home(0);}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
