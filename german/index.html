<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>德語學習</title><style>
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#FFFDF5;color:#2b2b2b}
header{background:#FFF6DE;padding:56px 20px 40px;text-align:center;border-bottom:4px solid #E8B84B;position:relative}
header::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(#222 0 33%,#C8282E 33% 66%,#E8B84B 66%)}
h1{font-size:44px;margin:0 0 12px}p.lead{font-size:18px;color:#555;max-width:720px;margin:0 auto;line-height:1.7}
main{max-width:1020px;margin:0 auto;padding:32px 20px 64px}
a.back{color:#86641A;text-decoration:none}
h2{font-size:28px;border-left:6px solid #86641A;padding-left:12px}
h3{font-size:20px;color:#86641A;margin:28px 0 10px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.tab{border:2px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:8px 20px;font-size:17px;cursor:pointer;font-family:inherit}
.tab.on{background:#E8B84B;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eee;border-top:4px solid #E8B84B;border-radius:14px;padding:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 8px 20px rgba(0,0,0,.14);transform:translateY(-3px)}
.card .k{font-size:15px;color:#86641A;font-weight:700}.card .t{font-size:18px;margin:6px 0}.card .d{font-size:14px;color:#666;line-height:1.6}
.box{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 20px;line-height:1.8}
.time{display:flex;border-radius:10px;overflow:hidden;font-size:13px;margin:10px 0}
.time div{padding:8px 6px;text-align:center;color:#5a4410;background:#FFF6DE;border-right:2px solid #fff}
.time div:nth-child(even){background:#FBE7B0}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee}
.tbl th{background:#FFF6DE;color:#86641A;text-align:left;padding:10px 12px;font-size:15px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid #f0e9d6;font-size:16px;line-height:1.6;vertical-align:top}
.de{font-size:19px;color:#1d3b8a;cursor:pointer}.de:hover{text-decoration:underline}
.de::before{content:"🔊 ";font-size:13px}
.ipa{color:#7a5a12;font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;white-space:nowrap}
.phon{color:#555}
ul{margin:6px 0;padding-left:22px;line-height:1.8}
.nav{display:flex;justify-content:space-between;margin-top:32px;gap:10px}
.btn{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px;font-family:inherit}
.btn:disabled{opacity:.35;cursor:default}
.speed{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:14px;color:#86641A;margin:0 0 6px;flex-wrap:wrap}
.speed button{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit}
.speed button.on{background:#E8B84B;color:#fff}
.note{background:#F3F7FF;border-left:4px solid #1d3b8a;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px;line-height:1.7}
.playall{margin:8px 0 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;font-size:14px}
footer{text-align:center;color:#999;padding:24px;font-size:14px;line-height:1.8}
@media(max-width:600px){h1{font-size:32px}.tbl td,.tbl th{font-size:14px;padding:8px}.de{font-size:17px}.time{font-size:11px}.ipa{white-space:normal}}
</style></head><body>
<header><h1>德語學習</h1><p class="lead">為了在德國生活、工作與過召會生活｜發音、入門會話文法、初級會話、中級會話各 15 堂，共 60 堂，每堂 45 分鐘。每個詞附國際音標（IPA）與中文近似音，藍色德文點一下就能聽發音。</p></header>
<main>
<p style="margin:0 0 16px"><a class="back" href="../">← 回首頁</a></p>
<div class="speed">朗讀速度：<button data-r="0.6">慢</button><button data-r="0.8" class="on">中</button><button data-r="1">正常</button></div>
<div id="app"></div>
</main>
<div id="toast"></div>
<footer>音標中的 ˈ 標在重音音節前，ː 表示長音。中文近似音只是輔助，請以點擊朗讀與老師發音為準。<br>朗讀使用德國標準德語語音（de-DE），若無聲音請在裝置設定中安裝德語語音。</footer>
<script src="../approx.js?v=20261128"></script>
<script src="lessons-1.js"></script>
<script src="lessons-2.js"></script>
<script src="lessons-3.js"></script>
<script src="lessons-4.js"></script>
<script>
const LESSONS=window.LESSONS||[];
const PER=15,TOTAL=60;
const LEVELS=[["發音","第 1–15 堂：字母、母音長短、變音 ä ö ü、ch／r／s 等子音、重音與語調，打好德語發音的根基"],["入門會話文法","第 16–30 堂：問候自介、名詞性別與冠詞、動詞變化、語序、受格、情態動詞、可分動詞"],["初級會話","第 31–45 堂：購物、餐廳、交通、看醫生、租屋、銀行、與鄰居來往、參加聚會"],["中級會話","第 46–60 堂：完成式與過去式、從句、與格與介系詞、找工作、職場、外國人局，以及在德國的召會生活"]];
const TIME=[["0–5","暖身複習"],["5–15","發音／語法重點"],["15–27","詞彙"],["27–33","例句"],["33–40","對話練習"],["40–45","練習與作業"]];
const W=[5,10,12,6,7,5];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let deVoice=null,rate=0.8;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').startsWith('de'));
  deVoice=vs.find(v=>/de-de/i.test(v.lang.replace('_','-'))&&/google|natural|online|anna|petra|markus|helena|katja/i.test(v.name))
        ||vs.find(v=>/de-de/i.test(v.lang.replace('_','-')))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500);}
function utter(text){
  const u=new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g,', ').replace(/[（(].*?[)）]/g,'').replace(/…/g,', '));
  u.lang=deVoice?deVoice.lang:'de-DE';u.rate=rate;if(deVoice)u.voice=deVoice;return u;
}
function speak(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();
  if(!deVoice)toast('找不到德語語音，可能用其他語音朗讀');
  speechSynthesis.speak(utter(text));
}
function speakAll(list){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();list.forEach(t=>speechSynthesis.speak(utter(t)));
}
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));});
app.addEventListener('click',e=>{
  const v=e.target.closest('.de');if(v){speak(v.dataset.say||v.textContent);return;}
  const a=e.target.closest('.playall');if(a){speakAll([...document.querySelectorAll('#'+a.dataset.t+' .de')].map(x=>x.dataset.say||x.textContent));}
});
const de=t=>`<span class="de" data-say="${esc(t)}">${esc(t)}</span>`;
const playBtn=id=>`<button class="btn playall" data-t="${id}">▶ 全部朗讀</button>`;

function home(lv){
  lv=lv||0;
  let h=`<div class="tabs">${LEVELS.map((l,i)=>`<button class="tab${i==lv?' on':''}" onclick="go('#lv${i}')">${l[0]}</button>`).join('')}</div>`;
  h+=`<h2>${LEVELS[lv][0]}</h2><p style="color:#666">${LEVELS[lv][1]}</p>`;
  if(lv==0)h+=soundTable();
  h+=`<div class="grid">`;
  for(let i=lv*PER;i<lv*PER+PER;i++){const L=LESSONS[i];if(!L)continue;
    h+=`<div class="card" onclick="go('#L${i+1}')"><div class="k">第 ${i+1} 堂</div><div class="t">${esc(L.t)}</div><div class="d">${esc(L.g)}</div></div>`;}
  h+=`</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function soundTable(){
  const T=[["ä","Käse、Bär","ɛ／ɛː","「ㄝ」","像 e 但嘴再張大一點"],["ö","schön、Köln","øː／œ","嘴圓唸「ㄝ」","嘴型唸 o，舌頭唸 e"],["ü","über、Tür","yː／ʏ","「ㄩ」","和國語「魚」的母音幾乎一樣"],["ei","mein、drei","aɪ̯","「哎」","不是「ㄟ」"],["ie","Liebe、wie","iː","長「衣」","ie 永遠是長 i"],["eu／äu","neu、Häuser","ɔʏ̯","「喔伊」","像英文 boy"],["ch（a o u 後）","Bach、Buch","x","喉嚨「ㄏ」","比國語「ㄏ」更後、更粗"],["ch（其他）","ich、Kirche","ç","「ㄒ」","舌面輕擦，像「希」不出聲"],["r","rot、Brot","ʁ","喉音「ㄏㄜ」","舌根輕輕摩擦小舌"],["-er 字尾","Vater、Lehrer","ɐ","輕「阿」","字尾 er 幾乎唸成 a"],["s（母音前）","Sonne、Rose","z","「ㄗ」帶聲","像英文 z"],["ß／ss","Straße、muss","s","「ㄙ」","清的 s"],["sch","Schule","ʃ","「噓」","嘴唇向前圓"],["sp／st 字首","Sprache、Stadt","ʃp／ʃt","「什ㄅ／什ㄉ」","字首的 s 唸 sch"],["w","Wasser、wir","v","「ㄈ」帶聲","上齒輕咬下唇"],["v","Vater、viel","f","「ㄈ」","大多唸 f"],["z","Zeit、Herz","ts","「ㄘ」","永遠唸 ts"],["j","ja、Jesus","j","「ㄧ」","像英文 y"],["字尾 b d g","halb、Bad、Tag","p／t／k","清音","字尾變清音（Auslautverhärtung）"]];
  return `<h3>德語發音特色一覽</h3><div class="wrap"><table class="tbl"><thead><tr><th>字母</th><th>例字</th><th>IPA</th><th>近似音</th><th>說明</th></tr></thead><tbody>${T.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1].split('、').map(de).join('　')}</td><td class="ipa">[${r[2]}]</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div><br>`;
}
function lesson(n){
  const L=LESSONS[n-1];if(!L)return home(0);const lv=Math.floor((n-1)/PER);
  let h=`<p><a class="back" href="#lv${lv}">← ${LEVELS[lv][0]}課程列表</a></p>`;
  h+=`<h2>第 ${n} 堂　${esc(L.t)}</h2><div class="box"><b>學習目標：</b>${esc(L.g)}<br><b>時間：</b>45 分鐘</div>`;
  h+=`<h3>時間分配</h3><div class="time">${TIME.map((t,i)=>`<div style="flex:${W[i]}">${t[0]} 分<br>${t[1]}</div>`).join('')}</div>`;
  h+=`<h3>一、暖身複習（5 分鐘）</h3><div class="box">${L.w?esc(L.w):(n==1?'先聽老師用德語打招呼，猜猜看是什麼意思；再介紹本課程：發音、入門會話文法、初級會話、中級會話四級，共 60 堂，每堂 45 分鐘。':'複習第 '+(n-1)+' 堂的詞彙，點讀詞彙表跟讀一遍，再抽 3 人用上一堂的句型口頭回答。')}${L.c?`<div class="note"><b>德國生活小知識：</b>${esc(L.c)}</div>`:''}</div>`;
  h+=`<h3>二、發音／語法重點（10 分鐘）</h3><div class="box"><ul>${L.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<h3>三、詞彙（12 分鐘）</h3><div class="wrap" id="tv"><table class="tbl"><thead><tr><th>德文</th><th>中文意思</th><th>IPA</th><th>中文近似音</th></tr></thead><tbody>${L.v.map(r=>`<tr><td>${de(r[0])}</td><td>${esc(r[1])}</td><td class="ipa">[${esc(r[2])}]</td><td class="phon">${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>${playBtn('tv')}`;
  const sp=L.s.some(r=>r[2]);
  h+=`<h3>四、例句（6 分鐘）</h3><div class="wrap" id="ts"><table class="tbl"><thead><tr><th>德文</th><th>中文</th>${sp?'<th>中文近似音</th>':''}</tr></thead><tbody>${L.s.map(r=>`<tr><td>${de(r[0])}${r[2]?'':ZYH(r[0],'de')}</td><td>${esc(r[1])}</td>${sp?`<td class="phon">${esc(r[2]||'')}</td>`:''}</tr>`).join('')}</tbody></table></div>${playBtn('ts')}`;
  h+=`<h3>五、對話練習（7 分鐘）</h3><div class="wrap" id="td"><table class="tbl"><thead><tr><th>角色</th><th>德文</th><th>中文</th></tr></thead><tbody>${L.d.map(r=>`<tr><td>${esc(r[0])}</td><td>${de(r[1])}${ZYH(r[1],'de')}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>${playBtn('td')}<p style="color:#666;font-size:14px">先全體跟讀，再兩人一組互換角色練習。</p>`;
  h+=`<h3>六、練習與作業（5 分鐘）</h3><div class="box"><b>課堂練習</b><ul>${L.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>回家作業：</b>${esc(L.h)}</div>`;
  h+=`<div class="nav"><button class="btn" ${n==1?'disabled':''} onclick="go('#L${n-1}')">← 上一堂</button><button class="btn" ${n==TOTAL?'disabled':''} onclick="go('#L${n+1}')">下一堂 →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(h){location.hash=h;}
function route(){const h=location.hash;let m;
  if((m=h.match(/^#L(\d+)$/)))lesson(+m[1]);else if((m=h.match(/^#lv(\d)$/)))home(+m[1]);else home(0);}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
