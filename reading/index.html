<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讀經進度卡</title><style>body{font-family:"Noto Sans CJK TC",sans-serif;max-width:1080px;margin:0 auto;padding:24px;background:#fdf8ee;color:#333}
h1,h2{text-align:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.tabs button{padding:10px 18px;border:2px solid #1f4d3a;background:#fff;color:#1f4d3a;border-radius:24px;cursor:pointer;font-size:16px}
.tabs button.active{background:#1f4d3a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#fff;border:1px solid #e6dec8;border-radius:16px;padding:12px;text-align:center}
.card img{width:100%;border-radius:8px}.card figcaption{margin:10px 0;line-height:1.6}
.dl{display:inline-block;padding:8px 20px;background:#c9a24a;color:#fff;text-decoration:none;border-radius:20px}
.plan{display:none}.plan.active{display:block}.soon{text-align:center;padding:60px 20px;color:#666}
.seg{display:block;margin:12px auto;max-width:520px;padding:14px;background:#fff;border:1px solid #e6dec8;border-radius:12px;text-align:center;text-decoration:none;color:#1f4d3a;font-size:18px}
.seg.soon{color:#999} a.back{color:#1f4d3a}</style></head><body>
<h1>讀經進度卡</h1><p style="text-align:center">綱要取自恢復本聖經。先選計畫，半年版再按 30 天一段點進子分頁，每張卡都可以下載。</p>
<div class="tabs" role="tablist">
<button class="active" onclick="show('half',this)">半年讀經一遍</button>
<button onclick="show('oneyear',this)">一年讀經一遍</button>
<button onclick="show('twoyear',this)">兩年讀經一遍</button>
<button onclick="show('halfnt',this)">半年新約一遍</button>
<button onclick="show('oneyearnt',this)">一年新約一遍</button>
</div>
<section id="half" class="plan active"><p style="text-align:center">半年版以 30 天為一段，第 1–182 天已上線。</p><a class="seg" href="half-year-1-30/">半年讀經一遍 第1–30天 →</a><a class="seg" href="half-year-31-60/">半年讀經一遍 第31–60天 →</a><a class="seg" href="half-year-61-90/">半年讀經一遍 第61–90天 →</a><a class="seg" href="half-year-91-120/">半年讀經一遍 第91–120天 →</a><a class="seg" href="half-year-121-150/">半年讀經一遍 第121–150天 →</a><a class="seg" href="half-year-151-182/">半年讀經一遍 第151–182天 →</a></section>
<section id="oneyear" class="plan"><div class="soon">一年讀經一遍（每天 3 章舊約、1 章新約）即將上線，敬請期待。</div></section>
<section id="twoyear" class="plan"><div class="soon">兩年讀經一遍即將上線，敬請期待。</div></section>
<section id="halfnt" class="plan"><div class="soon">半年新約一遍即將上線，敬請期待。</div></section>
<section id="oneyearnt" class="plan"><div class="soon">一年新約一遍即將上線，敬請期待。</div></section>
<script>function show(id,btn){document.querySelectorAll('.plan').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}</script>
</body></html>
