<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>俄語學習</title><style>
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#FFFDF5;color:#2b2b2b}
header{background:#FFF6DE;padding:56px 20px 40px;text-align:center;border-bottom:4px solid #E8B84B}
h1{font-size:44px;margin:0 0 12px}p.lead{font-size:18px;color:#555;max-width:680px;margin:0 auto;line-height:1.7}
main{max-width:1020px;margin:0 auto;padding:32px 20px 64px}
a.back{color:#86641A;text-decoration:none}
h2{font-size:28px;border-left:6px solid #86641A;padding-left:12px}
h3{font-size:20px;color:#86641A;margin:28px 0 10px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.tab{border:2px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:8px 20px;font-size:17px;cursor:pointer;font-family:inherit}
.tab.on{background:#E8B84B;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eee;border-top:4px solid #E8B84B;border-radius:14px;padding:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 8px 20px rgba(0,0,0,.14);transform:translateY(-3px)}
.card .k{font-size:15px;color:#86641A;font-weight:700}.card .t{font-size:18px;margin:6px 0}.card .d{font-size:14px;color:#666;line-height:1.6}
.box{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 20px;line-height:1.8}
.time{display:flex;border-radius:10px;overflow:hidden;font-size:13px;margin:10px 0}
.time div{padding:8px 6px;text-align:center;color:#5a4410;background:#FFF6DE;border-right:2px solid #fff}
.time div:nth-child(even){background:#FBE7B0}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee}
.tbl th{background:#FFF6DE;color:#86641A;text-align:left;padding:10px 12px;font-size:15px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid #f0e9d6;font-size:16px;line-height:1.6;vertical-align:top}
.ru{font-size:19px;color:#1d3b8a;cursor:pointer;white-space:nowrap}.ru:hover{text-decoration:underline}
.ru::before{content:"🔊 ";font-size:13px}
.phon{color:#555}
ul{margin:6px 0;padding-left:22px;line-height:1.8}
.nav{display:flex;justify-content:space-between;margin-top:32px;gap:10px}
.btn{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px;font-family:inherit}
.btn:disabled{opacity:.35;cursor:default}
.alpha td,.alpha th{text-align:center}
.alpha td:first-child{font-size:22px;color:#1d3b8a;font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;font-size:14px}
footer{text-align:center;color:#999;padding:24px;font-size:14px;line-height:1.8}
@media(max-width:600px){h1{font-size:32px}.tbl td,.tbl th{font-size:14px;padding:8px}.ru{font-size:17px;white-space:normal}.time{font-size:11px}}
</style></head><body>
<header><h1>俄語學習</h1><p class="lead">入門、初級、中級、專題各 10 堂，共 40 堂，每堂 60 分鐘。附中文近似音，藍色俄文點一下就能聽發音。</p></header>
<main>
<p style="margin:0 0 16px"><a class="back" href="../">← 回首頁</a></p>
<div id="app"></div>
</main>
<div id="toast"></div>
<footer>近似音只是輔助，請以點擊朗讀與老師發音為準。朗讀使用瀏覽器內建俄語語音，若無聲音請在裝置設定中安裝俄語語音。</footer>
<script src="../approx.js?v=20261128"></script>
<script src="lessons.js"></script>
<script>
const LEVELS=[["入門","第 1–10 堂：西里爾字母、發音、問候與自我介紹"],["初級","第 11–20 堂：基本句型與日常生活情境"],["中級","第 21–30 堂：過去式、未來式、格變化、敘事與校園、教會情境"],["專題","第 31–40 堂：文學、歷史、文化、旅遊、商務與福音主題"]];
const TIME=[["0–5","暖身複習"],["5–20","發音／語法重點"],["20–35","詞彙"],["35–45","例句"],["45–55","對話練習"],["55–60","練習與作業"]];
const W=[5,15,15,10,10,5];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ruVoice=null;
function loadVoice(){if(!('speechSynthesis' in window))return;ruVoice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().replace('_','-').startsWith('ru'))||null;}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500);}
function speak(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g,', ').replace(/[（(].*?[)）]/g,''));
  u.lang='ru-RU';u.rate=0.8;if(ruVoice)u.voice=ruVoice;
  if(!ruVoice)toast('找不到俄語語音，可能用其他語音朗讀');
  speechSynthesis.speak(u);
}
app.addEventListener('click',e=>{const v=e.target.closest('.ru');if(v)speak(v.dataset.say||v.textContent);});
const ru=t=>`<span class="ru" data-say="${esc(t)}">${esc(t)}</span>`;

function home(lv){
  lv=lv||0;
  let h=`<div class="tabs">${LEVELS.map((l,i)=>`<button class="tab${i==lv?' on':''}" onclick="go('#lv${i}')">${l[0]}</button>`).join('')}</div>`;
  h+=`<h2>${LEVELS[lv][0]}</h2><p style="color:#666">${LEVELS[lv][1]}</p>`;
  if(lv==0)h+=alphabetTable();
  h+=`<div class="grid">`;
  for(let i=lv*10;i<lv*10+10;i++){const L=LESSONS[i];
    h+=`<div class="card" onclick="go('#L${i+1}')"><div class="k">第 ${i+1} 堂</div><div class="t">${esc(L.t)}</div><div class="d">${esc(L.g)}</div></div>`;}
  h+=`</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function alphabetTable(){
  const A=[["А а","啊","a","мама","媽媽"],["Б б","貝","b","брат","哥哥／弟弟"],["В в","維","v","вода","水"],["Г г","給","g","город","城市"],["Д д","得","d","дом","家"],["Е е","耶","ye","нет","不、沒有"],["Ё ё","唷","yo","моё","我的（中性）"],["Ж ж","日（濁）","zh","жена","妻子"],["З з","茲","z","зима","冬天"],["И и","伊","i","мир","世界、和平"],["Й й","伊（短）","y","мой","我的（陽性）"],["К к","卡","k","кот","貓"],["Л л","勒","l","лампа","燈"],["М м","艾姆","m","мама","媽媽"],["Н н","恩","n","нос","鼻子"],["О о","喔","o","окно","窗戶"],["П п","佩","p","парк","公園"],["Р р","顫音 r","r","рыба","魚"],["С с","絲","s","стол","桌子"],["Т т","貼","t","телефон","電話"],["У у","烏","u","утро","早上"],["Ф ф","艾弗","f","фото","照片"],["Х х","喝（喉音）","kh","хлеб","麵包"],["Ц ц","次","ts","центр","中心"],["Ч ч","七","ch","чай","茶"],["Ш ш","施","sh","школа","學校"],["Щ щ","施（軟）","shch","ещё","還、再"],["Ъ ъ","硬音符號","—","объект","物體"],["Ы ы","咿（扁嘴）","y","ты","你"],["Ь ь","軟音符號","—","день","日子、白天"],["Э э","唉","e","это","這是"],["Ю ю","尤","yu","юг","南方"],["Я я","呀","ya","я","我"]];
  return `<h3>西里爾字母 33 個一覽</h3><p style="color:#666">俄語用西里爾字母拼寫，共 33 個字母。點藍色例字可以聽發音。Ъ、Ь 本身不發音，只改變前面子音的軟硬。</p><div class="wrap"><table class="tbl alpha"><thead><tr><th>字母</th><th>近似音</th><th>字母名</th><th>例字</th><th>中文</th></tr></thead><tbody>${A.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${ru(r[3])}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div><br>`;
}
function lesson(n){
  const L=LESSONS[n-1];if(!L)return home(0);const lv=Math.floor((n-1)/10);
  let h=`<p><a class="back" href="#lv${lv}">← ${LEVELS[lv][0]}課程列表</a></p>`;
  h+=`<h2>第 ${n} 堂　${esc(L.t)}</h2><div class="box"><b>學習目標：</b>${esc(L.g)}<br><b>時間：</b>60 分鐘</div>`;
  h+=`<h3>時間分配</h3><div class="time">${TIME.map((t,i)=>`<div style="flex:${W[i]}">${t[0]} 分<br>${t[1]}</div>`).join('')}</div>`;
  h+=`<h3>一、暖身複習（5 分鐘）</h3><div class="box">${n==1?'認識俄羅斯：人口約 1.4 億，首都莫斯科，官方語言是俄語，使用西里爾字母。俄語是聯合國六種官方語言之一。':'複習第 '+(n-1)+' 堂詞彙卡片，抽 3 人用上一堂句型口頭回答。'}</div>`;
  h+=`<h3>二、發音／語法重點（15 分鐘）</h3><div class="box"><ul>${L.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<h3>三、詞彙（15 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>俄文</th><th>中文意思</th><th>中文／注音近似音</th></tr></thead><tbody>${L.v.map(r=>`<tr><td>${ru(r[0])}</td><td>${esc(r[1])}</td><td class="phon">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<h3>四、例句（10 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>俄文</th><th>中文</th></tr></thead><tbody>${L.s.map(r=>`<tr><td>${ru(r[0])}${ZYH(r[0],'ru')}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<h3>五、對話練習（10 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>角色</th><th>俄文</th><th>中文</th></tr></thead><tbody>${L.d.map(r=>`<tr><td>${esc(r[0])}</td><td>${ru(r[1])}${ZYH(r[1],'ru')}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><p style="color:#666;font-size:14px">先全體跟讀，再兩人一組互換角色練習。</p>`;
  h+=`<h3>六、練習與作業（5 分鐘）</h3><div class="box"><b>課堂練習</b><ul>${L.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>回家作業：</b>${esc(L.h)}</div>`;
  h+=`<div class="nav"><button class="btn" ${n==1?'disabled':''} onclick="go('#L${n-1}')">← 上一堂</button><button class="btn" ${n==40?'disabled':''} onclick="go('#L${n+1}')">下一堂 →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(h){location.hash=h;}
function route(){const h=location.hash;let m;
  if((m=h.match(/^#L(\d+)$/)))lesson(+m[1]);else if((m=h.match(/^#lv(\d)$/)))home(+m[1]);else home(0);}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
