<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>越南語學習</title><style>
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#FFFDF5;color:#2b2b2b}
header{background:#FFF6DE;padding:56px 20px 40px;text-align:center;border-bottom:4px solid #E8B84B}
h1{font-size:44px;margin:0 0 12px}p.lead{font-size:18px;color:#555;max-width:680px;margin:0 auto;line-height:1.7}
main{max-width:1020px;margin:0 auto;padding:32px 20px 64px}
a.back{color:#86641A;text-decoration:none}
h2{font-size:28px;border-left:6px solid #86641A;padding-left:12px}
h3{font-size:20px;color:#86641A;margin:28px 0 10px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.tab{border:2px solid #E8B84B;background:#fff;color:#86641A;border-radius:999px;padding:8px 20px;font-size:17px;cursor:pointer;font-family:inherit}
.tab.on{background:#E8B84B;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eee;border-top:4px solid #E8B84B;border-radius:14px;padding:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 8px 20px rgba(0,0,0,.14);transform:translateY(-3px)}
.card .k{font-size:15px;color:#86641A;font-weight:700}.card .t{font-size:18px;margin:6px 0}.card .d{font-size:14px;color:#666;line-height:1.6}
.box{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 20px;line-height:1.8}
.time{display:flex;border-radius:10px;overflow:hidden;font-size:13px;margin:10px 0}
.time div{padding:8px 6px;text-align:center;color:#5a4410;background:#FFF6DE;border-right:2px solid #fff}
.time div:nth-child(even){background:#FBE7B0}
.wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee}
.tbl th{background:#FFF6DE;color:#86641A;text-align:left;padding:10px 12px;font-size:15px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid #f0e9d6;font-size:16px;line-height:1.6;vertical-align:top}
.vi{font-size:19px;color:#1d3b8a;cursor:pointer;white-space:nowrap}.vi:hover{text-decoration:underline}
.vi::before{content:"🔊 ";font-size:13px}
.phon{color:#555}
ul{margin:6px 0;padding-left:22px;line-height:1.8}
.nav{display:flex;justify-content:space-between;margin-top:32px;gap:10px}
.btn{border:1px solid #E8B84B;background:#fff;color:#86641A;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px;font-family:inherit}
.btn:disabled{opacity:.35;cursor:default}
.tones td,.tones th{text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;font-size:14px}
footer{text-align:center;color:#999;padding:24px;font-size:14px;line-height:1.8}
@media(max-width:600px){h1{font-size:32px}.tbl td,.tbl th{font-size:14px;padding:8px}.vi{font-size:17px;white-space:normal}.time{font-size:11px}}
</style></head><body>
<header><h1>越南語學習</h1><p class="lead">入門、初級、中級各 15 堂，共 45 堂，每堂 45 分鐘。附中文近似音，藍色越文點一下就能聽發音（北部標準音）。</p></header>
<main>
<p style="margin:0 0 16px"><a class="back" href="../">← 回首頁</a></p>
<div id="app"></div>
</main>
<div id="toast"></div>
<footer>近似音只是輔助，請以點擊朗讀與老師發音為準。朗讀使用瀏覽器內建越南語語音，若無聲音請在裝置設定中安裝越南語語音。</footer>
<script src="lessons.js"></script>
<script>
const LEVELS=[["入門","第 1–15 堂：字母、聲調、拼讀、問候與自我介紹"],["初級","第 16–30 堂：基本句型與日常生活情境"],["中級","第 31–45 堂：複句、敘事、閱讀與校園、教會情境"]];
const TIME=[["0–5","暖身複習"],["5–15","發音／語法重點"],["15–27","詞彙"],["27–33","例句"],["33–40","對話練習"],["40–45","練習與作業"]];
const W=[5,10,12,6,7,5];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let viVoice=null;
function loadVoice(){if(!('speechSynthesis' in window))return;viVoice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().replace('_','-').startsWith('vi'))||null;}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500);}
function speak(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g,', ').replace(/[（(].*?[)）]/g,''));
  u.lang='vi-VN';u.rate=0.8;if(viVoice)u.voice=viVoice;
  if(!viVoice)toast('找不到越南語語音，可能用其他語音朗讀');
  speechSynthesis.speak(u);
}
app.addEventListener('click',e=>{const v=e.target.closest('.vi');if(v)speak(v.dataset.say||v.textContent);});
const vi=t=>`<span class="vi" data-say="${esc(t)}">${esc(t)}</span>`;

function home(lv){
  lv=lv||0;
  let h=`<div class="tabs">${LEVELS.map((l,i)=>`<button class="tab${i==lv?' on':''}" onclick="go('#lv${i}')">${l[0]}</button>`).join('')}</div>`;
  h+=`<h2>${LEVELS[lv][0]}</h2><p style="color:#666">${LEVELS[lv][1]}</p>`;
  if(lv==0)h+=toneTable();
  h+=`<div class="grid">`;
  for(let i=lv*15;i<lv*15+15;i++){const L=LESSONS[i];
    h+=`<div class="card" onclick="go('#L${i+1}')"><div class="k">第 ${i+1} 堂</div><div class="t">${esc(L.t)}</div><div class="d">${esc(L.g)}</div></div>`;}
  h+=`</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function toneTable(){
  const T=[["平聲 ngang","ma","不標（a）","高而平","國語一聲"],["玄聲 huyền","mà","à","低而緩降","低沉的四聲"],["銳聲 sắc","má","á","往上揚","高而快的二聲"],["問聲 hỏi","mả","ả（小問號）","先降後升","國語三聲"],["跌聲 ngã","mã","ã","升高中間喉緊","斷開的二聲"],["重聲 nặng","mạ","ạ（下點）","低而短促","很短的四聲"]];
  return `<h3>六個聲調一覽</h3><div class="wrap"><table class="tbl tones"><thead><tr><th>聲調</th><th>例字</th><th>符號</th><th>調型</th><th>像國語</th></tr></thead><tbody>${T.map(r=>`<tr><td>${r[0]}</td><td>${vi(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div><br>`;
}
function lesson(n){
  const L=LESSONS[n-1];if(!L)return home(0);const lv=Math.floor((n-1)/15);
  let h=`<p><a class="back" href="#lv${lv}">← ${LEVELS[lv][0]}課程列表</a></p>`;
  h+=`<h2>第 ${n} 堂　${esc(L.t)}</h2><div class="box"><b>學習目標：</b>${esc(L.g)}<br><b>時間：</b>45 分鐘</div>`;
  h+=`<h3>時間分配</h3><div class="time">${TIME.map((t,i)=>`<div style="flex:${W[i]}">${t[0]} 分<br>${t[1]}</div>`).join('')}</div>`;
  h+=`<h3>一、暖身複習（5 分鐘）</h3><div class="box">${n==1?'認識越南：人口約一億，首都河內（Hà Nội），最大城市胡志明市（Thành phố Hồ Chí Minh）。':'複習第 '+(n-1)+' 堂詞彙卡片（Anki），抽 3 人用上一堂句型口頭回答。'}</div>`;
  h+=`<h3>二、發音／語法重點（10 分鐘）</h3><div class="box"><ul>${L.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<h3>三、詞彙（12 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>越南文</th><th>中文意思</th><th>中文／注音近似音</th></tr></thead><tbody>${L.v.map(r=>`<tr><td>${vi(r[0])}</td><td>${esc(r[1])}</td><td class="phon">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<h3>四、例句（6 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>越南文</th><th>中文</th></tr></thead><tbody>${L.s.map(r=>`<tr><td>${vi(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<h3>五、對話練習（7 分鐘）</h3><div class="wrap"><table class="tbl"><thead><tr><th>角色</th><th>越南文</th><th>中文</th></tr></thead><tbody>${L.d.map(r=>`<tr><td>${esc(r[0])}</td><td>${vi(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><p style="color:#666;font-size:14px">先全體跟讀，再兩人一組互換角色練習。</p>`;
  h+=`<h3>六、練習與作業（5 分鐘）</h3><div class="box"><b>課堂練習</b><ul>${L.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>回家作業：</b>${esc(L.h)}</div>`;
  h+=`<div class="nav"><button class="btn" ${n==1?'disabled':''} onclick="go('#L${n-1}')">← 上一堂</button><button class="btn" ${n==45?'disabled':''} onclick="go('#L${n+1}')">下一堂 →</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(h){location.hash=h;}
function route(){const h=location.hash;let m;
  if((m=h.match(/^#L(\d+)$/)))lesson(+m[1]);else if((m=h.match(/^#lv(\d)$/)))home(+m[1]);else home(0);}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
