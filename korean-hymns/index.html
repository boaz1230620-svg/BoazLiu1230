<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>韓語詩歌對照</title>
<style>
:root{
  --bg:#FFFDF5; --card:#ffffff; --ink:#2b2b2b; --muted:#666666; --line:#eeeae0;
  --accent:#86641A; --accent-soft:#FFF6DE; --ko:#1d4f7a; --roman:#7a4a1d; --zy:#2f6b3f; --chg:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --card:#211f1c; --ink:#ece7df; --muted:#a39d93; --line:#34302b;
    --accent:#d9a66b; --accent-soft:#3a2f23; --ko:#8cc0ec; --roman:#e2b27f; --zy:#8fcf9e; --chg:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --card:#211f1c; --ink:#ece7df; --muted:#a39d93; --line:#34302b;
  --accent:#d9a66b; --accent-soft:#3a2f23; --ko:#8cc0ec; --roman:#e2b27f; --zy:#8fcf9e; --chg:#ff8a80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5;font-size:calc(16px * var(--scale,1))}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
a{color:var(--accent)}
header .back{font-size:.9em;text-decoration:none}
h1{font-size:1.5em;margin:.4em 0 .2em}
.intro{color:var(--muted);margin:0 0 1em;font-size:.95em}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
input[type=search],input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:180px;font-family:inherit;line-height:1.6}
.list{list-style:none;padding:0;margin:12px 0}
.list li a{display:flex;gap:12px;align-items:baseline;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.list .no{color:var(--accent);font-weight:600;min-width:4.5em;font-size:.9em}
.list .ko{color:var(--ko);font-size:.9em}
.list .tag{margin-left:auto;font-size:.75em;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.chip-btn{font:inherit;font-size:.82em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chip-btn.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.hymn-title h2{margin:.2em 0 0;font-size:1.3em}
.hymn-title .kot{color:var(--ko);font-size:1.05em}
.hymn-title .nos{color:var(--muted);font-size:.85em}
.verse{margin:18px 0}
.vlabel{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;border-radius:8px;padding:0 9px;font-size:.85em;margin-bottom:6px}
.vlabel.chorus{background:var(--ko)}
.ln{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.ln .zh{grid-column:1;font-size:1.02em}
.ln .play{grid-column:2;grid-row:1 / span 3;align-self:start;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:15px;cursor:pointer}
.ln .play.speaking{background:var(--accent);color:var(--bg)}
.syls{grid-column:1;display:flex;flex-wrap:wrap;gap:6px 14px}
.w{display:flex;gap:2px}
.s{display:flex;flex-direction:column;align-items:center;min-width:1.9em;padding:2px 3px;border-radius:6px;cursor:pointer}
.s:hover{background:var(--accent-soft)}
.s .h{color:var(--ko);font-size:1.25em;line-height:1.2}
.s .p{color:var(--chg);font-size:.72em;line-height:1.2}
.s .r{color:var(--roman);font-size:.72em;line-height:1.3}
.s .z{color:var(--zy);font-size:.72em;line-height:1.3;white-space:nowrap}
.pn{align-self:flex-start;color:var(--muted);font-size:1.2em;padding-top:2px}
.flat{grid-column:1;display:flex;flex-direction:column;gap:1px}
.flat .h{color:var(--ko);font-size:1.15em}
.flat .p{color:var(--chg);font-size:.85em}
.flat .r{color:var(--roman);font-size:.9em}
.flat .z{color:var(--zy);font-size:.9em}
body.hide-zh .zh, body.hide-r .r, body.hide-z .z, body.hide-p .p{display:none}
.legend{font-size:.78em;color:var(--muted);margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend b{font-weight:500}
.legend .k{color:var(--ko)} .legend .r{color:var(--roman)} .legend .z{color:var(--zy)} .legend .p{color:var(--chg)}
.form{display:grid;gap:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:.85em;color:var(--muted);display:block;margin-bottom:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.help{font-size:.85em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.help code{background:var(--accent-soft);padding:0 4px;border-radius:4px}
.note{font-size:.82em;color:var(--muted);margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9em;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){.form .row{grid-template-columns:1fr}.syls{gap:6px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 回首頁</a>
    <h1>主恢復詩歌 韓中對照</h1>
    <p class="intro">逐節逐句：中文、韓文原文、實際發音、羅馬拼音、注音近似音。點任一字聽單字，按 ▶ 聽整句。</p>
  </header>
  <nav class="tabs">
    <button data-tab="list" class="on">詩歌目錄</button>
    <button data-tab="edit">新增詩歌</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script src="hymns.js" onerror="window.HYMNS_ENC=window.HYMNS_ENC||null"></script>
<script>
/* 韓文發音引擎：拆字 → 套用發音規則 → 羅馬拼音 + 注音近似音 */
(function (root) {
  const L_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const V_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const T_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  function decompose(ch) {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c < 0 || c > 11171) return null;
    return { L: L_LIST[Math.floor(c / 588)], V: V_LIST[Math.floor((c % 588) / 28)], T: T_LIST[c % 28] };
  }
  function compose(s) {
    const l = L_LIST.indexOf(s.L), v = V_LIST.indexOf(s.V), t = T_LIST.indexOf(s.T);
    if (l < 0 || v < 0 || t < 0) return '?';
    return String.fromCharCode(0xAC00 + (l * 21 + v) * 28 + t);
  }

  // 一行切成：詞（韓文字串）、空白、標點
  function tokenize(line) {
    const out = [];
    let word = null, other = '';
    const flushWord = () => { if (word) { out.push({ type: 'word', syl: word }); word = null; } };
    const flushOther = () => { if (other) { out.push({ type: 'punct', text: other }); other = ''; } };
    for (const ch of line) {
      const d = decompose(ch);
      if (d) { flushOther(); (word = word || []).push(Object.assign({ orig: ch }, d)); }
      else if (/\s/.test(ch)) { flushWord(); flushOther(); if (out.length && out[out.length - 1].type !== 'space') out.push({ type: 'space' }); }
      else { flushWord(); other += ch; }
    }
    flushWord(); flushOther();
    return out;
  }

  const SPLIT = { 'ㄳ':['ㄱ','ㅆ'],'ㄵ':['ㄴ','ㅈ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅆ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅄ':['ㅂ','ㅆ'] };
  const ASPIRATE = { 'ㄱ':'ㅋ','ㄷ':'ㅌ','ㅂ':'ㅍ','ㅈ':'ㅊ' };
  const H_AFTER = { 'ㄱ':['','ㅋ'],'ㄲ':['','ㅋ'],'ㄳ':['ㄱ','ㅆ'],'ㄺ':['ㄹ','ㅋ'],'ㄷ':['','ㅌ'],'ㅅ':['','ㅌ'],'ㅆ':['','ㅌ'],'ㅈ':['','ㅊ'],'ㅊ':['','ㅊ'],'ㅌ':['','ㅌ'],'ㅂ':['','ㅍ'],'ㅍ':['','ㅍ'],'ㄼ':['ㄹ','ㅍ'],'ㄵ':['ㄴ','ㅊ'],'ㅄ':['','ㅍ'] };
  const NEUT = { 'ㄱ':'ㄱ','ㄲ':'ㄱ','ㅋ':'ㄱ','ㄳ':'ㄱ','ㄺ':'ㄱ','ㄴ':'ㄴ','ㄵ':'ㄴ','ㄶ':'ㄴ','ㄷ':'ㄷ','ㅅ':'ㄷ','ㅆ':'ㄷ','ㅈ':'ㄷ','ㅊ':'ㄷ','ㅌ':'ㄷ','ㅎ':'ㄷ','ㄹ':'ㄹ','ㄼ':'ㄹ','ㄽ':'ㄹ','ㄾ':'ㄹ','ㅀ':'ㄹ','ㅁ':'ㅁ','ㄻ':'ㅁ','ㅂ':'ㅂ','ㅍ':'ㅂ','ㅄ':'ㅂ','ㄿ':'ㅂ','ㅇ':'ㅇ','':'' };
  const TENSE = { 'ㄱ':'ㄲ','ㄷ':'ㄸ','ㅂ':'ㅃ','ㅅ':'ㅆ','ㅈ':'ㅉ' };
  const NASAL = { 'ㄱ':'ㅇ','ㄷ':'ㄴ','ㅂ':'ㅁ' };

  // 一個詞內套用發音規則，回傳實際發音的音節
  function pronounce(syl) {
    const p = syl.map(s => ({ L: s.L, V: s.V, T: s.T }));
    const n = p.length;
    const pairs = f => { for (let i = 0; i < n - 1; i++) f(p[i], p[i + 1]); };

    // 1. ㅎ 激音化／脫落
    pairs((a, b) => {
      if (a.T === 'ㅎ' || a.T === 'ㄶ' || a.T === 'ㅀ') {
        const rem = a.T === 'ㅎ' ? '' : (a.T === 'ㄶ' ? 'ㄴ' : 'ㄹ');
        if (ASPIRATE[b.L]) { b.L = ASPIRATE[b.L]; a.T = rem; }
        else if (b.L === 'ㅅ') { b.L = 'ㅆ'; a.T = rem; }
        else if (b.L === 'ㄴ') { a.T = rem || 'ㄴ'; }
        else if (b.L === 'ㅇ') { a.T = ''; if (rem) b.L = rem; }
      } else if (b.L === 'ㅎ' && H_AFTER[a.T]) {
        const r = H_AFTER[a.T]; a.T = r[0]; b.L = r[1];
        if (b.L === 'ㅌ' && b.V === 'ㅣ') b.L = 'ㅊ';
      }
    });
    // 2. 連音
    pairs((a, b) => {
      if (b.L !== 'ㅇ' || !a.T || a.T === 'ㅇ') return;
      if (SPLIT[a.T]) { const s = SPLIT[a.T]; a.T = s[0]; b.L = s[1]; }
      else { b.L = a.T; a.T = ''; }
      if (b.V === 'ㅣ') { if (b.L === 'ㄷ') b.L = 'ㅈ'; else if (b.L === 'ㅌ') b.L = 'ㅊ'; }
    });
    // 3. 收尾音代表音
    for (let i = 0; i < n; i++) {
      const a = p[i], b = p[i + 1];
      if (a.T === 'ㄺ' && b && b.L === 'ㄱ') { a.T = 'ㄹ'; b.L = 'ㄲ'; }
      else a.T = NEUT[a.T] !== undefined ? NEUT[a.T] : a.T;
    }
    // 4. ㄹ 相關
    pairs((a, b) => {
      if (b.L === 'ㄹ') {
        if (a.T === 'ㄴ') a.T = 'ㄹ';
        else if (a.T === 'ㅁ' || a.T === 'ㅇ' || NASAL[a.T]) b.L = 'ㄴ';
      }
      if (a.T === 'ㄹ' && b.L === 'ㄴ') b.L = 'ㄹ';
    });
    // 5. 鼻音化
    pairs((a, b) => { if ((b.L === 'ㄴ' || b.L === 'ㅁ') && NASAL[a.T]) a.T = NASAL[a.T]; });
    // 6. 緊音化
    pairs((a, b) => { if (NASAL[a.T] && TENSE[b.L]) b.L = TENSE[b.L]; });
    // 7. 母音
    p.forEach((s, i) => {
      if (s.V === 'ㅢ') {
        if (syl[i].L !== 'ㅇ') s.V = 'ㅣ';
        else if (i > 0 && i === n - 1) s.V = 'ㅔ';   // 助詞「의」
        else if (i > 0) s.V = 'ㅣ';
      }
      if (s.V === 'ㅖ' && s.L !== 'ㅇ' && s.L !== 'ㄹ') s.V = 'ㅔ';
    });
    return p;
  }

  const RR_L = { 'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h' };
  const RR_V = { 'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i' };
  const RR_T = { '':'','ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng' };

  function roman(s, prev) {
    const l = (s.L === 'ㄹ' && prev && prev.T === 'ㄹ') ? 'l' : RR_L[s.L];
    return l + RR_V[s.V] + (RR_T[s.T] !== undefined ? RR_T[s.T] : '');
  }

  const ZI = { 'ㄱ':'ㄍ','ㄲ':'ㄍ','ㄴ':'ㄋ','ㄷ':'ㄉ','ㄸ':'ㄉ','ㄹ':'ㄌ','ㅁ':'ㄇ','ㅂ':'ㄅ','ㅃ':'ㄅ','ㅅ':'ㄙ','ㅆ':'ㄙ','ㅇ':'','ㅈ':'ㄗ','ㅉ':'ㄗ','ㅊ':'ㄘ','ㅋ':'ㄎ','ㅌ':'ㄊ','ㅍ':'ㄆ','ㅎ':'ㄏ' };
  const ZV = { 'ㅏ':'ㄚ','ㅐ':'ㄝ','ㅑ':'ㄧㄚ','ㅒ':'ㄧㄝ','ㅓ':'ㄛ','ㅔ':'ㄝ','ㅕ':'ㄧㄛ','ㅖ':'ㄧㄝ','ㅗ':'ㄡ','ㅘ':'ㄨㄚ','ㅙ':'ㄨㄝ','ㅚ':'ㄨㄝ','ㅛ':'ㄧㄡ','ㅜ':'ㄨ','ㅝ':'ㄨㄛ','ㅞ':'ㄨㄝ','ㅟ':'ㄨㄧ','ㅠ':'ㄧㄨ','ㅡ':'ㄜ','ㅢ':'ㄜㄧ','ㅣ':'ㄧ' };
  const ZT = { 'ㄹ':'ˡ','ㅁ':'ᵐ','ㄱ':'ᵏ','ㄷ':'ᵗ','ㅂ':'ᵖ' };

  function zhuyin(s) {
    let i = ZI[s.L], v = ZV[s.V];
    if (v[0] === 'ㄧ') i = ({ 'ㄙ':'ㄒ','ㄗ':'ㄐ','ㄘ':'ㄑ' })[i] || i;
    const last = v[v.length - 1], head = v.slice(0, -1);
    if (s.T === 'ㄴ') {
      if (v === 'ㄧㄛ') v = 'ㄧㄢ';
      else if (last === 'ㄚ') v = head + 'ㄢ';
      else if (last === 'ㄛ' || last === 'ㄜ') v = head + 'ㄣ';
      else if (last === 'ㄧ' || last === 'ㄨ') v = v + 'ㄣ';
      else v = v + 'ⁿ';
    } else if (s.T === 'ㅇ') {
      if (last === 'ㄚ') v = head + 'ㄤ';
      else if (last === 'ㄛ' || last === 'ㄜ') v = head + 'ㄥ';
      else if (v === 'ㄡ') v = 'ㄨㄥ';
      else if (v === 'ㄧㄡ') v = 'ㄩㄥ';
      else if (last === 'ㄧ' || last === 'ㄨ') v = v + 'ㄥ';
      else v = v + 'ⁿᵍ';
    } else if (ZT[s.T]) v = v + ZT[s.T];
    return i + v;
  }

  // 一整行 → token 陣列，每個音節帶 orig / pron / roman / zy
  function analyze(line) {
    return tokenize(line || '').map(tok => {
      if (tok.type !== 'word') return tok;
      const pr = pronounce(tok.syl);
      return {
        type: 'word',
        syl: tok.syl.map((s, i) => ({
          orig: s.orig,
          pron: compose(pr[i]),
          roman: roman(pr[i], pr[i - 1]),
          zy: zhuyin(pr[i])
        }))
      };
    });
  }
  function lineRoman(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.roman).join('') : t.type === 'space' ? ' ' : t.text).join('');
  }
  function lineZhuyin(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.zy).join(' ') : t.type === 'space' ? '　' : t.text).join('');
  }
  function linePron(tokens) {
    return tokens.map(t => t.type === 'word' ? t.syl.map(s => s.pron).join('') : t.type === 'space' ? ' ' : t.text).join('');
  }

  root.KoPron = { analyze, lineRoman, lineZhuyin, linePron };
  if (typeof module !== 'undefined') module.exports = root.KoPron;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }

  // ---------- 設定 ----------
  const prefs = Object.assign({ zh:true, p:true, r:true, z:true, mode:'syl', scale:1, rate:0.8 }, store.get('kh-prefs', {}));
  function applyPrefs(){
    document.body.classList.toggle('hide-zh', !prefs.zh);
    document.body.classList.toggle('hide-p', !prefs.p);
    document.body.classList.toggle('hide-r', !prefs.r);
    document.body.classList.toggle('hide-z', !prefs.z);
    document.documentElement.style.setProperty('--scale', prefs.scale);
    store.set('kh-prefs', prefs);
  }
  applyPrefs();

  // ---------- 資料 ----------
  let builtIn = [];
  const ENC = window.HYMNS_ENC || null;

  // ---------- 加密 ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u8 => btoa(String.fromCharCode.apply(null, u8));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pw, salt){
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  }
  async function encryptList(list, pw){
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt);
    const data = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(list))));
    return { v:1, salt:b64(salt), iv:b64(iv), data:b64(data) };
  }
  async function decryptList(enc, pw){
    const key = await deriveKey(pw, unb64(enc.salt));
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
    return JSON.parse(td.decode(plain));

  // ---------- 新增詩歌 ----------
  const LABEL_RE = /^\s*(\d+|副歌?|후렴|C|chorus)\s*[\.、:：)）]?\s*(.*)$/i;
  const LABEL_ONLY = /^\s*(\d+|副歌?|후렴|C|chorus)\s*[\.、:：)）]?\s*$/i;
  // 貼上自動清理：原封不動貼 app 分享出來的文字即可。
  // 只做三件事，不改任何歌詞行本身：
  // 1) 去掉單獨一行的網址；2) 把開頭的標題／編號行抽出來（見 applyClean 的欄位規則）；
  // 3) 把連續空行壓成一個。節號（單獨一行或行首）本來就由 parseLyrics 處理，這裡不動它。
  // 標題抽出的判斷很保守，避免把無標題、無節號的第一節誤當標題：
  // - 開頭第一段只有一行，且後面出現帶節號的段，才當作標題／編號；
  // - 或開頭第一段第一行不是節號、第二行就是節號（中間沒有空行），才把節號前的行當作標題／編號。
  // 無標題、無節號的詩歌（例如韓文 1 號那種）完全符合「不抽出」的條件，原樣通過。
  function isLabelLine(ln){ return LABEL_ONLY.test(ln) || LABEL_RE.test(ln); }
  function cleanPasted(text){
    const rawLines = String(text || '').replace(/\r/g, '').split('\n');
    const lines = [];
    let urlRemoved = 0;
    for (const ln of rawLines){
      const t = ln.trim();
      if (/^(https?:\/\/|www\.)\S*$/i.test(t)){ urlRemoved++; continue; }
      lines.push(t);
    }
    while (lines.length && !lines[0]) lines.shift();
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    let header = null, headerKind = null;
    const firstLabelIdx = lines.findIndex(ln => ln && isLabelLine(ln));
    if (firstLabelIdx > 0){
      const blankBefore = lines.slice(0, firstLabelIdx).includes('');
      if (!blankBefore){
        header = lines.slice(0, firstLabelIdx).join(' ');
        lines.splice(0, firstLabelIdx);
      } else {
        const firstBlank = lines.indexOf('');
        const firstBlock = lines.slice(0, firstBlank);
        if (firstBlock.length === 1){
          header = firstBlock[0];
          lines.splice(0, firstBlank + 1);
        }
      }
    }
    const out = [];
    let prevBlank = false;
    for (const ln of lines){
      if (!ln){ if (!prevBlank) out.push(''); prevBlank = true; }
      else { out.push(ln); prevBlank = false; }
    }
    while (out.length && !out[0]) out.shift();
    while (out.length && out[out.length - 1] === '') out.pop();
    if (header){
      const h = header.trim();
      if (/^(大本|小本|補充本)/.test(h) || (/^[^\s]{1,8}$/.test(h) && /\d/.test(h))) headerKind = 'number';
      else headerKind = 'title';
      return { text: out.join('\n'), header: h, headerKind, urlRemoved };
    }
    return { text: out.join('\n'), header: null, headerKind: null, urlRemoved };
  }
  // 把 cleanPasted 的結果套用到一個歌詞框。
  // 標題／編號只有在對應欄位空白時才填入，絕不覆蓋已填的內容；
  // 若欄位已有內容，開頭那行會留在歌詞裡（只去掉網址、壓空行），由使用者手動刪，
  // 這樣按兩次清理也不會吃掉第一節。
  function applyClean(textarea, isKo){
    const res = cleanPasted(textarea.value);
    const titleEl = document.querySelector(isKo ? '#f-koTitle' : '#f-zhTitle');
    const noEl = document.querySelector(isKo ? '#f-koNo' : '#f-zhNo');
    let applied = null;
    if (res.header){
      if (res.headerKind === 'number' && noEl && !noEl.value.trim()){ noEl.value = res.header; applied = 'number'; }
      else if (res.headerKind === 'title' && titleEl && !titleEl.value.trim()){ titleEl.value = res.header; applied = 'title'; }
    }
    if (applied) textarea.value = res.text;
    else if (res.header) textarea.value = res.header + '\n\n' + res.text;
    else textarea.value = res.text;
    return { applied, urlRemoved: res.urlRemoved, header: res.header };
  }
  function parseLyrics(text){
    const raw = String(text || '').replace(/\r/g, '').split('\n').map(s => s.trim());
    const blocks = []; let cur = null;
    for (const ln of raw){
      if (!ln){ cur = null; continue; }
      if (LABEL_ONLY.test(ln)){ cur = [ln]; blocks.push(cur); continue; }
      if (!cur){ cur = []; blocks.push(cur); }
      cur.push(ln);
    }
    let auto = 0;
    return blocks.filter(b => b.length).map(lines => {
      let label = null;
      const m = lines[0].match(LABEL_RE);
      if (m){ label = /^\d+$/.test(m[1]) ? m[1] : '副'; if (m[2]) lines[0] = m[2]; else lines.shift(); }
      if (!label) label = String(++auto); else if (/^\d+$/.test(label)) auto = +label;
      return { label, lines };
    }).filter(v => v.lines.length);
  }
  // 行數多的一邊依比例併成和另一邊一樣多行
  function group(arr, j, n, sep){
    if (!arr.length) return '';
    if (arr.length <= n) return arr[j] || '';
    return arr.slice(Math.floor(j * arr.length / n), Math.floor((j + 1) * arr.length / n)).join(sep);
  }
  function buildHymn(f){
    const zv = parseLyrics(f.zh), kv = parseLyrics(f.ko);
    const n = Math.max(zv.length, kv.length);
    const verses = [];
    for (let i = 0; i < n; i++){
      const z = zv[i] || { lines:[] }, k = kv[i] || { lines:[] };
      const zl = z.lines, kl = k.lines;
      const n = (zl.length && kl.length) ? Math.min(zl.length, kl.length) : Math.max(zl.length, kl.length);
      const lines = [];
      for (let j = 0; j < n; j++) lines.push({ zh: group(zl, j, n, ''), ko: group(kl, j, n, ' ') });
      verses.push({ label: (k.label || z.label || String(i + 1)), lines });
    }
    const id = f.id || ('h' + (f.zhNo || f.koNo || Date.now()).toString().replace(/\W+/g, '') || 'h' + Date.now());
    return { id, zhNo: f.zhNo, koNo: f.koNo, zhTitle: f.zhTitle, koTitle: f.koTitle, verses };
  }
  function versesToText(h, key){
    return (h.verses || []).map(v => v.label + '\n' + v.lines.map(l => l[key]).join('\n')).join('\n\n');
  }
  function downloadFile(name, text){

  }
  function cleanForExport(h){ const c = Object.assign({}, h); delete c._src; return c; }

      '<div class="form" style="margin-top:12px">' +
      '<div class="row"><div><label>中文詩歌號碼</label><input type="text" id="f-zhNo" placeholder="例：大本 1" value="' + esc(v.zhNo) + '"></div>' +
      '<div><label>韓文詩歌號碼</label><input type="text" id="f-koNo" value="' + esc(v.koNo) + '"></div></div>' +

      '<div class="btns"><button class="btn" id="b-save">存到這台裝置</button>' +
      '<button class="btn ghost" id="b-clean">自動清理貼上的文字</button>' +

      '<p class="note">「存到這台裝置」只有你這支手機／電腦看得到。要放上網站，按「下載加密的 hymns.js」，再上傳到 GitHub 的 korean-hymns 資料夾覆蓋同名檔案；網站上只有知道密碼的人能打開。</p>' +
      '</div><h3 style="margin-top:22px">預覽</h3><div id="preview"></div>';
    const ids = ['zhNo','koNo','zhTitle','koTitle','zh','ko'];
    const read = () => { const f = { id: v.id }; ids.forEach(k => f[k] = $('#f-' + k).value.trim()); return f; };

      list = list.filter(x => x.id !== 'demo');
      const enc = await encryptList(list, password);
      downloadFile('hymns.js', '// 主恢復詩歌 韓中對照資料（已加密，需密碼才能在網頁上開啟）\nwindow.HYMNS_ENC = ' + JSON.stringify(enc) + ';\n');
      toast('已用目前的密碼加密');
    };
    $('#b-clear').onclick = () => { if (confirm('清空表單？')){ store.set('kh-draft', null); viewEdit(); } };
    app.onclick = e => { const t = e.target.closest('.play,.s'); if (!t) return; if (t.dataset.line) speak(t.dataset.line, t); else if (t.dataset.say) speak(t.dataset.say); };
  }

  // ---------- 路由 ----------
  function route(){
    const hs = location.hash.slice(1);
    const tab = hs.startsWith('edit') ? 'edit' : 'list';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    app.onclick = null;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (password === null){ viewLock(); return; }
    if (hs.startsWith('h=')) viewHymn(decodeURIComponent(hs.slice(2)));
    else if (hs.startsWith('edit=')) viewEdit(decodeURIComponent(hs.slice(5)));
    else if (hs.startsWith('edit')) viewEdit();
    else viewList();
    window.scrollTo(0, 0);
  }
  // 分頁點擊必須每次都重繪：若網址雜湊已經是目標值，瀏覽器不會觸發 hashchange，
  // 只改分頁底線、不換內容，就會卡在「分頁是新增詩歌、內容還是目錄」的狀態。
  // 所以雜湊已是目標時直接呼叫 route() 強制重繪，否則照常改雜湊（會觸發 hashchange）。
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    const target = b.dataset.tab === 'edit' ? 'edit' : '';
    if (location.hash.slice(1) === target) route();
    else location.hash = target;
  });
  window.addEventListener('hashchange', route);
  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem('kh-pw') || localStorage.getItem('kh-pw'); } catch(e){}
    if (saved){ try { await tryUnlock(saved); } catch(e){ password = null; } }
    route();
  })();
})();
</script>
</body>
</html>
