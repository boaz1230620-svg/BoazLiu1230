<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>雅各一生的年日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6ecd8;--ink:#3a2e22;--red:#b3262d;--blue:#24508f;--brown:#a8742c;--muted:#7a6a55;--card:#fffaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-family:"Noto Serif TC",serif;font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.stage{background:#fbf3e2;border:1px solid #e2d2b3;border-radius:14px;padding:6px;overflow-x:auto}
svg{display:block;width:100%;min-width:640px;height:auto;font-family:"Noto Sans TC",sans-serif}
.el{opacity:0;transition:opacity .7s ease}
.el.on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
.draw.on{stroke-dashoffset:0}
.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.5)}}
.marker{transition:transform 1s ease}
.controls{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0}
button{font:inherit;font-size:.95rem;border:1px solid #cdb68e;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:#dccaa6;cursor:pointer}
.dot.on{background:var(--red)}
.card{background:var(--card);border:1px solid #e2d2b3;border-radius:14px;padding:16px 18px}
.card h2{font-family:"Noto Serif TC",serif;font-size:1.2rem;margin:0 0 4px;color:var(--red)}
.card .age{font-size:.85rem;color:var(--blue);font-weight:700}
.card p{margin:6px 0 10px}
.verse{border-left:3px solid var(--brown);padding:4px 0 4px 12px;margin:8px 0;font-family:"Noto Serif TC",serif}
.verse b{color:var(--blue);font-family:"Noto Sans TC",sans-serif;font-size:.85rem;margin-right:6px}
.eq{font-family:"Noto Serif TC",serif;font-size:1.25rem;font-weight:700;text-align:center;padding:8px;background:#f8e9e2;border-radius:10px;margin:8px 0}
details{margin-top:18px;background:var(--card);border:1px solid #e2d2b3;border-radius:14px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
.def{background:#f3ead6;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem}.def>b{color:#b3262d;display:block;margin-bottom:4px}.def div b{color:#24508f}
mark{background:#fff36b;color:inherit;padding:0 3px;border-radius:3px}
.legend{font-size:.85rem;color:#7a6a55;margin:-6px 0 12px}
h3.zoom{font-family:"Noto Serif TC",serif;font-size:1rem;margin:14px 0 6px;color:#a8742c}
.note{color:var(--muted);font-size:.8rem;margin-top:14px}
</style>
</head>

  <h1>雅各一生的年日</h1>
  <p class="sub">由左到右：雅各往拉班家（? 歲）→ 見法老（130 歲）。經文用恢復本。</p>
  <p class="legend"><b>聖經明言：</b>雅各 130 歲見法老（創47:9）、147 歲去世（創47:28）；約瑟 17 歲（創37:2）、30 歲侍立在法老面前（創41:46）。<br><mark>螢光「可能是…歲」</mark> ＝ 聖經沒有明言，由經文推算的年歲範圍。</p>

    <g class="el" data-s="5">
      <text x="398" y="332" text-anchor="middle" font-size="18" fill="#b3262d" font-weight="700">17</text>
    </g>

    <!-- ===== step 6: Joseph before Pharaoh ===== -->
    <g class="el" data-s="6">
      <line x1="732" y1="182" x2="732" y2="218" stroke="#3a2e22" stroke-width="3"/>
      <text x="700" y="40" text-anchor="middle" font-size="16">☆ 約瑟在法老前侍立</text>
      <text x="700" y="58" text-anchor="middle" font-size="13" fill="#24508f">創41:46</text>
      <line x1="732" y1="64" x2="732" y2="180" stroke="#a8742c" stroke-width="1.2" stroke-dasharray="3 4"/>
      <text x="732" y="240" text-anchor="middle" font-size="14" fill="#24508f" font-weight="700">30歲</text>
    </g>

    <!-- ===== step 7: 7 years of plenty ===== -->

    <g class="el" data-s="8">
      <text x="858" y="128" text-anchor="middle" font-size="14" fill="#a8742c" font-weight="700">2個荒年</text>
      <text x="858" y="145" text-anchor="middle" font-size="12" fill="#24508f">創45:6</text>
      <line x1="858" y1="150" x2="856" y2="182" stroke="#a8742c" stroke-width="1"/>
    </g>

    <!-- ===== step 9: Jacob sees Pharaoh ===== -->
    <g class="el" data-s="15">
      <line x1="871" y1="178" x2="871" y2="222" stroke="#3a2e22" stroke-width="4"/>
      <rect x="770" y="76" width="112" height="28" rx="4" fill="none" stroke="#b3262d" stroke-width="2"/>
      <text x="826" y="97" text-anchor="middle" font-size="18" font-weight="700">雅各見法老</text>
      <text x="914" y="240" text-anchor="end" font-size="13" fill="#24508f" font-weight="700" class="hl">可能是39–40歲</text>
      <text x="878" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#b3262d">130</text>
      <text x="878" y="292" text-anchor="middle" font-size="10" fill="#24508f">創47:9</text>
    </g>

    <!-- ===== step 10: calculation ===== -->
    <path class="draw" data-s="16" pathLength="1" d="M530 300 L530 310 L871 310 L871 300" fill="none" stroke="#24508f" stroke-width="2"/>
    <g class="el" data-s="16">
      <text x="700" y="332" text-anchor="middle" font-size="16" fill="#24508f" font-weight="700">後半22年 = 39−17 = 13+7+2</text>
    </g>
    <path class="draw" data-s="16" pathLength="1" d="M50 352 L50 362 L530 362 L530 352" fill="none" stroke="#b3262d" stroke-width="2"/>
    <g class="el" data-s="16">
      <text x="290" y="386" text-anchor="middle" font-size="16" fill="#b3262d" font-weight="700">前半31年 = 14 + 17</text>
      <text x="700" y="380" text-anchor="middle" font-size="19" fill="#b3262d" font-weight="700">130 − 22 − 31 ≈ 77</text>
    </g>

    <!-- ===== step 11: all Jacob ages ===== -->
    <g class="el" data-s="17" text-anchor="middle" font-weight="700">
      <g font-size="11" fill="#7a6a55" font-weight="500">
        <text x="158" y="258">可能是</text><text x="267" y="258">可能是</text><text x="360" y="258">可能是</text>
        <text x="530" y="258">可能是</text><text x="732" y="258">可能是</text><text x="812" y="258">可能是</text>

        <text x="158" y="276" class="hl">83–85</text><text x="267" y="276" class="hl">90–91</text><text x="360" y="276" class="hl">96–98</text>

    </g>
  </svg>
  </div>

  <p class="note">推算方式依你的手繪圖：由雅各見法老時 130 歲，往回扣約瑟的歲數，直接計算得 77 歲；考慮經文沒有明言的部分，可能是 76–78 歲。<br>經文取自 <a href="https://line.twgbr.org/recoveryversion/bible/01.html">台灣福音書房・聖經恢復本線上版</a>。</p>

<script>
const V={
 "創28:10":"雅各出了別是巴，向哈蘭走去；",

 "創37:2":"雅各的記畧如下。約瑟十七歲時與他哥哥們一同牧羊。……",
 "創37:28":"所以當米甸的商人從那裏經過，約瑟的哥哥們就把約瑟從坑裏拉上來，講定二十錠銀子，把約瑟賣給以實瑪利人。他們就把約瑟帶到埃及去了。",
 "創41:46":"約瑟開始侍立在埃及王法老面前的時候，年三十歲。他從法老面前出去，遍行埃及全地。",
 "創41:53":"埃及地的七個豐年一過，",

 "創42:3":"於是，約瑟的十個哥哥都下埃及買糧去了。",

 "創43:2":"他們從埃及帶來的糧喫盡了，他們的父親就對他們說，你們再去給我們買一點糧食來。",
