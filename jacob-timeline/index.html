<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅各一生動畫數線圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6ecd8;--ink:#3a2e22;--red:#b3262d;--blue:#24508f;--brown:#a8742c;--muted:#7a6a55;--card:#fffaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-family:"Noto Serif TC",serif;font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.stage{background:#fbf3e2;border:1px solid #e2d2b3;border-radius:14px;padding:6px;overflow-x:auto}
svg{display:block;width:100%;min-width:640px;height:auto;font-family:"Noto Sans TC",sans-serif}
.el{opacity:0;transition:opacity .7s ease}
.el.on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
.draw.on{stroke-dashoffset:0}
.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.5)}}
.marker{transition:transform 1s ease}
.controls{display:flex;gap:8px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}
button{font:inherit;font-size:.95rem;border:1px solid #cdb68e;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:#dccaa6;cursor:pointer}
.dot.on{background:var(--red)}
.card{background:var(--card);border:1px solid #e2d2b3;border-radius:14px;padding:16px 18px}
.card h2{font-family:"Noto Serif TC",serif;font-size:1.2rem;margin:0 0 4px;color:var(--red)}
.card .age{font-size:.85rem;color:var(--blue);font-weight:700}
.card p{margin:6px 0 10px}
.verse{border-left:3px solid var(--brown);padding:4px 0 4px 12px;margin:8px 0;font-family:"Noto Serif TC",serif}
.verse b{color:var(--blue);font-family:"Noto Sans TC",sans-serif;font-size:.85rem;margin-right:6px}
.eq{font-family:"Noto Serif TC",serif;font-size:1.25rem;font-weight:700;text-align:center;padding:8px;background:#f8e9e2;border-radius:10px;margin:8px 0}
details{margin-top:18px;background:var(--card);border:1px solid #e2d2b3;border-radius:14px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
.def{background:#f3ead6;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem}.def b{color:#b3262d;display:block;margin-bottom:4px}
mark{background:#fff36b;color:inherit;padding:0 3px;border-radius:3px}
.legend{font-size:.85rem;color:#7a6a55;margin:-6px 0 12px}
.note{color:var(--muted);font-size:.8rem;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <p style="margin:0 0 10px"><a href="../" style="color:#86641A;text-decoration:none">← 回首頁</a></p>
  <h1>雅各一生數線圖</h1>
  <p class="sub">由左到右：雅各往拉班家（? 歲）→ 見法老（130 歲）。經文用恢復本。</p>
  <p class="legend"><mark>螢光</mark> ＝ 聖經沒有明寫、推算出來的年齡；沒有螢光的 130、147 歲（雅各）與 17、30 歲（約瑟）是經文明寫的。</p>

  <div class="stage">
  <svg viewBox="0 0 920 400" id="chart" aria-label="雅各一生數線圖">
    <!-- axis -->
    <line x1="30" y1="200" x2="900" y2="200" stroke="#24508f" stroke-width="3"/>
    <polygon points="900,193 914,200 900,207" fill="#24508f"/>

    <!-- moving marker -->
    <g id="marker" class="marker"><circle cx="0" cy="200" r="9" fill="#b3262d" stroke="#fff" stroke-width="2"/></g>

    <!-- ===== step 0: go to Laban ===== -->
    <g class="el" data-s="0">
      <line x1="50" y1="185" x2="50" y2="215" stroke="#3a2e22" stroke-width="3"/>
      <rect x="40" y="38" width="122" height="30" rx="4" fill="none" stroke="#b3262d" stroke-width="2"/>
      <text x="101" y="60" text-anchor="middle" font-size="19" font-weight="700">雅各去拉班家</text>
      <text x="50" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#b3262d" id="age77" class="hl">?</text>
    </g>

    <!-- ===== step 1: 7 years for Rachel ===== -->
    <path class="draw" data-s="1" pathLength="1" d="M50 200 Q104 140 158 200" fill="none" stroke="#b3262d" stroke-width="2.5"/>
    <g class="el" data-s="1">
      <text x="104" y="160" text-anchor="middle" font-size="17" fill="#b3262d" font-weight="700">7年</text>
      <line x1="158" y1="190" x2="158" y2="210" stroke="#3a2e22" stroke-width="2"/>
      <text x="158" y="105" text-anchor="middle" font-size="16">娶利亞、拉結</text>
      <text x="158" y="124" text-anchor="middle" font-size="13" fill="#24508f">創29:20, 27</text>
    </g>

    <!-- ===== step 2: another 7 years ===== -->
    <path class="draw" data-s="2" pathLength="1" d="M158 200 Q212 140 267 200" fill="none" stroke="#b3262d" stroke-width="2.5"/>
    <g class="el" data-s="2">
      <text x="212" y="160" text-anchor="middle" font-size="17" fill="#b3262d" font-weight="700">7年</text>
    </g>
    <path class="draw" data-s="2" pathLength="1" d="M50 300 L50 310 L267 310 L267 300" fill="none" stroke="#3a2e22" stroke-width="2"/>
    <g class="el" data-s="2">
      <text x="158" y="332" text-anchor="middle" font-size="15">14年 為2個女兒服事</text>
    </g>

    <!-- ===== step 3: Joseph born, asks to go home ===== -->
    <g class="el" data-s="3">
      <line x1="267" y1="182" x2="267" y2="218" stroke="#3a2e22" stroke-width="3"/>
      <text x="282" y="58" text-anchor="middle" font-size="16">生約瑟後，請求回鄉</text>
      <text x="282" y="77" text-anchor="middle" font-size="13" fill="#24508f">創30:25</text>
      <line x1="267" y1="84" x2="267" y2="180" stroke="#b3262d" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="267" y="240" text-anchor="middle" font-size="14" fill="#24508f" font-weight="700">約瑟出生</text>
    </g>

    <!-- ===== step 4: 6 more years for flock ===== -->
    <path class="draw" data-s="4" pathLength="1" d="M267 200 Q314 145 360 200" fill="none" stroke="#b3262d" stroke-width="2.5"/>
    <g class="el" data-s="4">
      <text x="314" y="162" text-anchor="middle" font-size="17" fill="#b3262d" font-weight="700">6年</text>
      <line x1="360" y1="190" x2="360" y2="210" stroke="#3a2e22" stroke-width="2"/>
      <text x="380" y="110" text-anchor="middle" font-size="15">為羊群再服事6年</text>
      <text x="380" y="128" text-anchor="middle" font-size="13" fill="#24508f">創31:41</text>
    </g>

    <!-- ===== step 5: Joseph sold ===== -->
    <path class="draw" data-s="5" pathLength="1" d="M267 200 Q398 120 530 200" fill="none" stroke="#a8742c" stroke-width="2" stroke-dasharray="1"/>
    <g class="el" data-s="5">
      <line x1="530" y1="182" x2="530" y2="218" stroke="#3a2e22" stroke-width="3"/>
      <text x="530" y="62" text-anchor="middle" font-size="16">☆ 約瑟被賣到埃及</text>
      <text x="530" y="81" text-anchor="middle" font-size="13" fill="#24508f">創37:2, 28</text>
      <text x="530" y="240" text-anchor="middle" font-size="14" fill="#24508f" font-weight="700">17歲</text>
    </g>
    <path class="draw" data-s="5" pathLength="1" d="M267 300 L267 310 L530 310 L530 300" fill="none" stroke="#b3262d" stroke-width="2"/>
    <g class="el" data-s="5">
      <text x="398" y="332" text-anchor="middle" font-size="18" fill="#b3262d" font-weight="700">17</text>
    </g>

    <!-- ===== step 6: Joseph before Pharaoh ===== -->
    <g class="el" data-s="6">
      <line x1="732" y1="182" x2="732" y2="218" stroke="#3a2e22" stroke-width="3"/>
      <text x="700" y="40" text-anchor="middle" font-size="16">☆ 約瑟在法老前侍立</text>
      <text x="700" y="58" text-anchor="middle" font-size="13" fill="#24508f">創41:46</text>
      <line x1="732" y1="64" x2="732" y2="180" stroke="#a8742c" stroke-width="1.2" stroke-dasharray="3 4"/>
      <text x="732" y="240" text-anchor="middle" font-size="14" fill="#24508f" font-weight="700">30歲</text>
    </g>

    <!-- ===== step 7: 7 years of plenty ===== -->
    <path class="draw" data-s="7" pathLength="1" d="M732 200 Q786 145 840 200" fill="none" stroke="#a8742c" stroke-width="2.5"/>
    <g class="el" data-s="7">
      <text x="786" y="160" text-anchor="middle" font-size="15" fill="#a8742c" font-weight="700">7個豐年</text>
      <line x1="840" y1="190" x2="840" y2="210" stroke="#3a2e22" stroke-width="2"/>
    </g>

    <!-- ===== step 8: 2 years of famine ===== -->
    <path class="draw" data-s="8" pathLength="1" d="M840 200 Q856 178 871 200" fill="none" stroke="#a8742c" stroke-width="2.5"/>
    <g class="el" data-s="8">
      <text x="858" y="128" text-anchor="middle" font-size="14" fill="#a8742c" font-weight="700">2個荒年</text>
      <text x="858" y="145" text-anchor="middle" font-size="12" fill="#24508f">創45:6</text>
      <line x1="858" y1="150" x2="856" y2="182" stroke="#a8742c" stroke-width="1"/>
    </g>

    <!-- ===== step 9: Jacob sees Pharaoh ===== -->
    <g class="el" data-s="9">
      <line x1="871" y1="178" x2="871" y2="222" stroke="#3a2e22" stroke-width="4"/>
      <rect x="770" y="76" width="112" height="28" rx="4" fill="none" stroke="#b3262d" stroke-width="2"/>
      <text x="826" y="97" text-anchor="middle" font-size="18" font-weight="700">雅各見法老</text>
      <text x="871" y="240" text-anchor="middle" font-size="14" fill="#24508f" font-weight="700" class="hl">39歲</text>
      <text x="871" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#b3262d">130</text>
    </g>

    <!-- ===== step 10: calculation ===== -->
    <path class="draw" data-s="10" pathLength="1" d="M530 300 L530 310 L871 310 L871 300" fill="none" stroke="#24508f" stroke-width="2"/>
    <g class="el" data-s="10">
      <text x="700" y="332" text-anchor="middle" font-size="16" fill="#24508f" font-weight="700">後半22年 = 39−17 = 13+7+2</text>
    </g>
    <path class="draw" data-s="10" pathLength="1" d="M50 352 L50 362 L530 362 L530 352" fill="none" stroke="#b3262d" stroke-width="2"/>
    <g class="el" data-s="10">
      <text x="290" y="386" text-anchor="middle" font-size="16" fill="#b3262d" font-weight="700">前半31年 = 14 + 17</text>
      <text x="700" y="380" text-anchor="middle" font-size="19" fill="#b3262d" font-weight="700">130 − 22 − 31 = 77</text>
    </g>

    <!-- ===== step 11: all Jacob ages ===== -->
    <g class="el" data-s="11" font-size="15" fill="#b3262d" font-weight="700" text-anchor="middle">
      <text x="158" y="268" class="hl">84</text>
      <text x="267" y="268" class="hl">91</text>
      <text x="360" y="268" class="hl">97</text>
      <text x="530" y="268" class="hl">108</text>
      <text x="732" y="268" class="hl">121</text>
      <text x="826" y="268" class="hl">128</text>
      <text x="14" y="244" text-anchor="start" font-size="11" fill="#24508f">約瑟</text>
      <text x="14" y="288" text-anchor="start" font-size="11">雅各歲數</text>
    </g>
  </svg>
  </div>

  <div class="controls">
    <button id="prev" aria-label="上一步">◀</button>
    <button id="play" class="primary">▶ 播放</button>
    <button id="next" aria-label="下一步">▶</button>
    <div class="dots" id="dots"></div>
  </div>

  <div class="card" id="card"></div>

  <details>
    <summary>全部相關經文（恢復本）</summary>
    <div id="allv"></div>
  </details>
  <p class="note">推算方式依你的手繪圖：由雅各見法老時 130 歲，往回扣約瑟的歲數，得出雅各去拉班家時是 77 歲。<br>經文取自 <a href="https://line.twgbr.org/recoveryversion/bible/01.html">台灣福音書房・聖經恢復本線上版</a>。</p>
</div>

<script>
const V={
 "創28:10":"雅各出了別是巴，向哈蘭走去；",
 "創29:18":"雅各愛拉結，就說，我願為你小女兒拉結服事你七年。",
 "創29:20":"雅各就為拉結服事了七年；他因為深愛拉結，就看這七年如同幾天。",
 "創29:27":"你為這一個滿了七日，我們就把那一個也給你，只要你再為她服事我七年。",
 "創30:25":"拉結生約瑟之後，雅各對拉班說，請打發我走，叫我回到我本鄉本地去。",
 "創31:41":"我這二十年在你家裏，為你的兩個女兒服事你十四年，為你的羊羣服事你六年，你十次改了我的工價。",
 "創37:2":"雅各的記畧如下。約瑟十七歲時與他哥哥們一同牧羊。……",
 "創37:28":"所以當米甸的商人從那裏經過，約瑟的哥哥們就把約瑟從坑裏拉上來，講定二十錠銀子，把約瑟賣給以實瑪利人。他們就把約瑟帶到埃及去了。",
 "創41:46":"約瑟開始侍立在埃及王法老面前的時候，年三十歲。他從法老面前出去，遍行埃及全地。",
 "創41:53":"埃及地的七個豐年一過，",
 "創41:54":"七個荒年就來了，正如約瑟所說的。各地都有饑荒，惟獨埃及全地有糧食。",
 "創45:6":"現在這地的饑荒已經二年了，並且還有五年不能耕種，不能收成。",
 "創47:9":"雅各對法老說，我寄居在世的年日是一百三十歲；我平生的年日又少又苦，不及我列祖在世寄居的年日。",
 "創47:28":"雅各住在埃及地十七年，雅各平生的年日是一百四十七歲。"
};
const X={77:50,84:158,91:267,97:360,108:530,121:732,128:840,130:871};
const S=[
 {t:"雅各去拉班家",x:77,a:"雅各 ? 歲",p:"雅各離開父家，往哈蘭去投靠舅舅拉班。這時他幾歲？聖經沒有直接說，要從後面的年日推算。（他到拉班家先住了一個月，才談定為拉結服事七年，創29:14–18；這一個月在推算裏可以略去。）",v:["創28:10"]},
 {t:"為拉結服事七年",x:84,a:"第 1–7 年",p:"雅各為拉結服事七年，卻先被給了利亞。",v:["創29:18","創29:20"]},
 {t:"再服事七年",x:91,a:"第 8–14 年",p:"為拉結再服事七年；為兩個女兒一共服事十四年。",v:["創29:27","創31:41"]},
 {t:"生約瑟後，請求回鄉",x:91,a:"約瑟出生",p:"拉結生了約瑟，雅各就請拉班打發他回本鄉。把這事放在十四年滿的時候，是對照創31:41推出來的（十四年之後接著是為羊群的六年）。",v:["創30:25"]},
 {t:"為羊群再服事六年",x:97,a:"約瑟出生 → 6 歲",p:"拉班留他，雅各又為羊群服事六年，在拉班家共二十年。之後雅各回迦南，到約瑟被賣還有 11 年。",v:["創31:41"]},
 {t:"☆ 約瑟被賣到埃及",x:108,a:"約瑟 17 歲",p:"從約瑟出生到被賣，是 17 年。",v:["創37:2","創37:28"]},
 {t:"☆ 約瑟在法老前侍立",x:121,a:"約瑟 30 歲",p:"約瑟三十歲站在法老面前，被立治理埃及全地。",v:["創41:46"]},
 {t:"七個豐年",x:128,a:"約瑟 30 → 37 歲",p:"埃及地七個豐年。",v:["創41:53"]},
 {t:"兩個荒年",x:130,a:"約瑟 37 → 39 歲",p:"七個豐年完了，荒年臨到；約瑟向弟兄表明自己時，饑荒已經二年，雅各隨即下埃及。所以雅各見法老是在第二個荒年。",v:["創41:54","創45:6"]},
 {t:"雅各見法老",x:130,a:"雅各 130 歲・約瑟 <mark>39</mark> 歲",p:"雅各下埃及見法老，自述在世的年日是一百三十歲。約瑟此時 30 + 7 + 2 = <mark>39</mark> 歲。",v:["創47:9"]},
 {t:"往回推算",x:77,a:"雅各去拉班家 = <mark>77</mark> 歲",p:"以約瑟被賣（雅各<mark>108</mark>歲）為分界，把雅各從到拉班家到見法老的年日分成前後兩段：",defs:[["前半 31 年：從到拉班家到失去約瑟（<mark>77</mark> → <mark>108</mark>）","31 = 14 + 17<br>14 年：為拉班兩個女兒服事，到約瑟出生（創29:20, 27；30:25）<br>17 年：約瑟出生到被賣，就是約瑟的歲數（創37:2）；其中 6 年仍在拉班家為羊群服事（創31:41），11 年在迦南"],["後半 22 年：失去約瑟到見法老（<mark>108</mark> → 130）","22 = 39 − 17 = 13 + 7 + 2<br>13 年：約瑟 17 → 30 歲，在埃及為奴、下監，到侍立在法老面前（創37:2；41:46）<br>7 年：七個豐年（創41:53）<br>2 年：兩個荒年，雅各下埃及（創45:6）"]],eq:"130 − 22 − 31 = <mark>77</mark><br><span style=\"font-size:.9em\">（<mark>77</mark> + 31 + 22 = 130，創47:9）</span>",v:[]},
 {t:"雅各的年歲總覽",x:130,a:"<mark>77</mark> → 130 歲",p:"<mark>77</mark> 歲到拉班家，<mark>84</mark> 歲娶妻，<mark>91</mark> 歲生約瑟，<mark>97</mark> 歲離開拉班，<mark>108</mark> 歲失去約瑟，130 歲見法老（以上螢光的歲數都是推算的）。之後在埃及再住 17 年，147 歲去世。",v:["創47:28"]}
];
let s=0,timer=null,shown=-1;
const els=[...document.querySelectorAll('[data-s]')],marker=document.getElementById('marker');
const dots=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{stop();go(i)};dots.appendChild(d)});
function vHTML(k){return `<div class="verse"><b>${k}</b>${V[k]}</div>`}
const NS="http://www.w3.org/2000/svg";
const HL=[...document.querySelectorAll('text.hl')].map(t=>{const r=document.createElementNS(NS,'rect');r.setAttribute('fill','#fff36b');r.setAttribute('rx','3');t.parentNode.insertBefore(r,t);return [t,r]});
function updHL(){HL.forEach(([t,r])=>{try{const b=t.getBBox();r.setAttribute('x',b.x-3);r.setAttribute('y',b.y+1);r.setAttribute('width',b.width+6);r.setAttribute('height',b.height-2)}catch(e){}})}
if(document.fonts)document.fonts.ready.then(updHL);
function go(i){
  s=Math.max(0,Math.min(S.length-1,i));
  els.forEach(e=>e.classList.toggle('on',+e.dataset.s<=s));
  const st=S[s];
  marker.style.transform=`translateX(${X[st.x]}px)`;
  if(s>=10){document.getElementById('age77').textContent='77';}else{document.getElementById('age77').textContent='?';}
  updHL();
  const c=document.getElementById('card');
  c.innerHTML=`<div class="age">${st.a}</div><h2>${st.t}</h2><p>${st.p}</p>${(st.defs||[]).map(d=>`<div class="def"><b>${d[0]}</b><div>${d[1]}</div></div>`).join('')}${st.eq?`<div class="eq">${st.eq}</div>`:''}${st.v.map(vHTML).join('')}`;
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j<=s));
  document.getElementById('prev').disabled=s===0;
  document.getElementById('next').disabled=s===S.length-1;
}
function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 播放'}
document.getElementById('prev').onclick=()=>{stop();go(s-1)};
document.getElementById('next').onclick=()=>{stop();go(s+1)};
document.getElementById('play').onclick=()=>{
  if(timer){stop();return}
  if(s===S.length-1){go(0)}
  document.getElementById('play').textContent='⏸ 暫停';
  timer=setInterval(()=>{if(s>=S.length-1){stop();return}go(s+1)},3200);
};
document.getElementById('allv').innerHTML=Object.keys(V).map(vHTML).join('');
go(0);
</script>
</body>
</html>
